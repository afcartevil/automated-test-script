# Copy to config.yaml (same directory) and fill in your tokens.
# Tokens expire periodically — refresh from browser DevTools on hk-intra-paas.transsion.com.

defaults:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"

# Reusable auth profiles — multiple services can reference the same profile.
auth_profiles:
  hk-intra-paas:
    origin: "https://hk-intra-paas.transsion.com"
    referer: "https://hk-intra-paas.transsion.com/"
    p_appid: "220713001"
    # authorization and p_auth are usually the same value
    authorization: ""
    p_auth: ""
    p_rtoken: ""

# Service endpoints — add new HAR-derived modules here.
services:
  tones-build-platform:
    base_url: "https://api-tones.transsion.com"
    path_prefix: "/tones-build-platform"
    auth_profile: "hk-intra-paas"
  tones-spd:
    base_url: "https://api-tones.transsion.com"
    path_prefix: "/tones-spd"
    auth_profile: "hk-intra-paas"
