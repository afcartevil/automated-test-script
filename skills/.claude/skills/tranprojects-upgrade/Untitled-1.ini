# SCP Sensor 配置验证

对 MTK tinysys SCP 项目（RV55_A/RV33_A）执行系统性的 sensor 配置生效验证，确保 project.mk 中所有 sensor 相关宏正确关联到驱动实现、DTS 配置、算法库。

## 适用场景

用户要求对某个 SCP 项目进行 sensor 配置检查时调用。典型触发语：
- "检查 xxx 项目的 sensor 配置是否生效"
- "验证 project.mk 中 sensor 宏"
- "排查 sensor 功能缺失问题"
- "帮我看看 sensor 配置有没有遗漏"

## 构建系统宏传递机制（通用原理）

以下流程适用于所有 MTK SCP 项目：

```
Makefile (顶层)
  └─ build/main.mk → build/config.mk
       ├─ platform.mk  ← 定义 CFG_ 宏默认值
       ├─ project.mk   ← 项目级覆盖（-include，后加载覆盖前者）
       ├─ sensorhub.mk ← CFG_SENSORHUB_SUPPORT=yes 时引入
       │    └─ 所有 sensor 驱动的 ifeq 条件编译/链接块
       ├─ chre.mk      ← CFG_CHRE_SUPPORT=yes 时引入
       │    └─ 可能包含部分传感器虚拟驱动（如 stationary/glance/pickup）
       ├─ rvxx.mk      ← 定义 RVXX_LIB（如 RV55_A），影响 algo 库路径
       └─ tinysys_config.h ← platform.mk + project.mk 所有 CFG_ 宏 → #define
            └─ -include 注入所有 .c 文件编译（非 ifeq 形式的宏通过此方式生效）
```

**加载顺序**（关键）：platform.mk 先加载 → project.mk 后加载（`-include`，L212），后者覆盖前者。

**两种生效方式**：
1. **构建系统级** (`ifeq`): 在 sensorhub.mk/chre.mk 中通过 `ifeq ($(CFG_XXX),yes)` 控制文件编译/链接
2. **源码级** (`#ifdef`): 通过 tinysys_config.h 的 `#define` 注入 C 源码的条件编译

## 检查步骤

### 步骤 1：确定项目路径参数

从用户输入或上下文中获取以下路径参数：
- `PLATFORM`: 芯片平台名，如 `mt6789`、`mt6858`、`mt6895`
- `PROCESSOR`: 处理器名，如 `RV55_A`、`RV33_A`
- `PROJECT`: 项目名，如 `lj6_h897`、`x6895_h8925`

构建路径：
- `PROJECT_DIR = z:/path/to/scp/project/{PROCESSOR}/{PLATFORM}/{PROJECT}`
- `PLATFORM_DIR = z:/path/to/scp/project/{PROCESSOR}/{PLATFORM}/platform`
- `PROJECT_MK = {PROJECT_DIR}/project.mk`
- `PLATFORM_MK = {PLATFORM_DIR}/platform.mk`
- `RVXX_MK = {PLATFORM_DIR}/rvxx.mk`
- `SENSORHUB_MK = {PLATFORM_DIR}/features/sensorhub.mk`
- `CHRE_MK = {PLATFORM_DIR}/features/chre.mk`
- `DTS_C = {PROJECT_DIR}/sensor/dts.c`
- `OVERLAY_H = {PROJECT_DIR}/inc/overlay_sensor.h`

### 步骤 2：提取 project.mk 中全部 sensor 宏

逐行分析 `project.mk` 的 sensor 配置段（通常以 `####### sensor config start #######` 标注），提取所有 `CFG_` 开头的宏，按以下分类记录：

1. **Feature 功能宏**: `CFG_SENSORHUB_SUPPORT`、`CFG_ACCGYRO_SUPPORT`、`CFG_ALSPS_SUPPORT`、`CFG_MAGNETOMETER_SUPPORT`、`CFG_FUSION_SUPPORT` 等
2. **器件型号宏**: `CFG_ICM4N607_SUPPORT`、`CFG_MMC5603_SUPPORT`、`CFG_MN78911_SUPPORT` 等
3. **虚拟传感器宏**: `CFG_TILT_SUPPORT`、`CFG_MOTION_SUPPORT`、`CFG_ANTI_TOUCH_SUPPORT`、`CFG_ELEVATOR_DETECT_SUPPORT` 等
4. **系统配置宏**: `CFG_MAG_PROJECT_NAME`、`CFG_SENSOR_BROADCAST_DEPUTY_TASK` 等

**必须同时记录 `= yes` 和 `= no` 的宏**。`no` 的宏用于排查功能被意外关闭的情况。

### 步骤 3：语法验证

- 所有宏使用 `CFG_XXX = value` 格式（等号两侧空格可选）
- 布尔值统一为 `yes`/`no`，非 `true`/`false`
- 无拼写错误
- 无重复定义（同一宏在 project.mk 中出现两次）

### 步骤 4：platform.mk 覆盖关系

搜索 platform.mk 中与 project.mk 同名的宏，对比值：
- 值不同 → 确认 project.mk 的值是最终有效值（后加载覆盖）
- platform.mk 中不存在 → 标记为项目新增宏

特别关注：`CFG_SENSORHUB_SUPPORT` 必须在 platform.mk 中默认为 `no`，由 project.mk 覆盖为 `yes`。

### 步骤 5：逐宏验证驱动实现关联

对 project.mk 中每个 `= yes` 的宏，按以下**三层递进搜索**：

```
Layer 1: sensorhub.mk 中搜索 ifeq ($(CFG_XXX),yes)
    ├── 找到 → ✅ 构建级生效，记录编译文件和链接库，结束
    └── 未找到 → 进入 Layer 2

Layer 2: chre.mk 中搜索 ifeq ($(CFG_XXX),yes)
    ├── 找到 → 检查 CFG_CHRE_SUPPORT 值
    │   ├── CHRE_SUPPORT = yes → ✅ 构建级生效（CHRE 路径）
    │   └── CHRE_SUPPORT = no  → 🟡 CHRE 未启用，此路径不生效，继续 Layer 3
    └── 未找到 → 进入 Layer 3

Layer 3: C 源码中搜索 #ifdef CFG_XXX（middleware/sensorhub 和 drivers 目录）
    ├── 找到 → ✅ 源码级生效（tinysys_config.h #define 注入）
    └── 未找到 → 🔴 完全未生效（死宏）
```

**判定结论**：
- `sensorhub.mk 找到` → **构建级生效**（sensorhub 路径）
- `chre.mk 找到 + CHRE=yes` → **构建级生效**（CHRE 路径）
- `chre.mk 找到 + CHRE=no + C源码找到` → **源码级生效**
- `chre.mk 找到 + CHRE=no + C源码未找到` → 🔴 **P1: 完全未生效**
- `均未找到 + C源码找到` → **源码级生效**
- `均未找到 + C源码未找到` → 🔴 **P1: 完全未生效**

### 步骤 6：DTS 配置完整性

分析 `sensor/dts.c` 中所有 `#ifdef CFG_XXX` 和 `#ifdef CFG_XXX_SUPPORT` 块（两种形式都要搜索）：

1. **DTS 中有但 project.mk 未定义的宏** → 🔴 DTS 配置不会生效
2. **project.mk 中 = yes 但 DTS 中无对应 #ifdef 的宏** → 🟡 缺少 DTS 硬件参数配置
3. 检查各传感器硬件参数（bus_id、slave_addr、direction、eint_num 等）是否合理

### 步骤 7：库文件依赖检查

分两部分检查：

**A. 项目专属静态库**（路径包含 `CFG_MAG_PROJECT_NAME`）：
```
{PROJECT_DIR}/msensor/{vendor}/*.a
{PROJECT_DIR}/sensorlib/alslib/*.a
```
使用 Glob 检查文件是否存在。

**B. 算法库目录**（sensorhub.mk 中 `LIBFLAGS` 引用的 algo 库）：
- 确认 `rvxx.mk` 中 `RVXX_LIB` 的值（如 `RV55_A`）
- 确认 `ALGO_DIR = $(SENSORHUB_DIR)/algos/$(RVXX_LIB)` 路径下各算法子目录存在：
  - `{ALGO_DIR}/pedometer/libpedometer.a`
  - `{ALGO_DIR}/motion/libmotion.a`
  - `{ALGO_DIR}/elevator_detect/libelevator_detect.a`
  - 等...

通用算法库由 MTK 基线保证，但**目录结构缺失会导致链接失败**。

### 步骤 8：辅助文件检查

- **opts.mk**: 检查是否存在（`-include` 引入，缺失不影响构建），如有则列出 sensor 相关配置
- **overlay_sensor.h**: 检查其中配置的传感器芯片是否与 project.mk 中实际启用的匹配。如 `CFG_OVERLAY_INIT_SUPPORT=no` 则当前无影响，但若将来启用需更新
- **single_data_ld.h**: 检查是否需要额外数据分区配置
- **cust_ois_param.h**: 如果 OIS=yes 需验证参数
- **cache_ld.h**: 检查 cache 配置

### 步骤 9：冲突检查

- platform.mk 和 project.mk 之间是否存在同一宏的值冲突
- 互斥功能是否同时启用
- HEAP 分配是否正确响应 sensor 宏（platform.mk 中搜索 `TOTAL_HEAP_SIZE` 的 sensor 相关条件）
- 检查 `CFG_SENSOR_BROADCAST_DEPUTY_TASK` 对 heap 的影响

## 输出格式

验证完成后，按以下格式输出报告：

```
## {PROJECT} ({PLATFORM}/{PROCESSOR}) SCP Sensor 配置验证报告

### 一、宏定义清单
[表格：宏名 | 值 | 分类]

### 二、语法检查
[表格：检查项 | 结果]

### 三、platform.mk 覆盖关系
[表格：宏名 | platform.mk | project.mk | 最终 | 状态]

### 四、驱动实现关联验证
[表格：宏名(=yes) | 生效方式 | 位置 | 结论]
生效方式取值：构建级(sensorhub) / 构建级(CHRE) / 源码级(#ifdef) / 未生效

### 五、DTS 配置
[表格：#ifdef宏 | project.mk值 | 状态]

### 六、库文件依赖
[表格：文件路径 | 存在 | 对应宏]

### 七、辅助配置
[表格：文件 | 状态 | 说明]

### 八、问题汇总
[编号 | 级别 | 宏 | 问题描述 | 修复建议 | 优先级]
优先级：立即修复 / 建议修复 / 确认后处理

### 九、整体评估
[评分表 + 结论]
```

## 问题级别定义

| 级别 | 标识 | 含义 | 修复优先级 |
|------|:---:|------|:---:|------|
| P1 | 🔴 | 宏设为 yes 但实际不生效，功能缺失 | 立即修复 |
| P2 | 🟡 | 宏设为 yes 但生效范围有限，或缺少对应配置 | 建议修复 |
| P3 | 🟢 | 信息提示，需确认意图 | 确认后处理 |

## 修复建议模板

| 问题类型 | 标准修复建议 |
|---------|-------------|
| 死宏（完全未生效） | 1. 确认是否需要在 sensorhub.mk 中添加 ifeq 块<br>2. 或确认宏是否应设为 no<br>3. 或检查是否使用了错误的宏名（如缺少 _SUPPORT 后缀） |
| CHRE 依赖未启用 | 1. 若需 CHRE 功能：project.mk 中添加 `CFG_CHRE_SUPPORT = yes`<br>2. 若不需 CHRE：在 sensorhub.mk 中添加独立驱动块，或接受当前限制 |
| 器件 .c 与 #ifdef 不匹配 | 1. 确认 sensorhub.mk 中编译的 .c 文件是否正确<br>2. 或确认 #ifdef 是否应添加到当前编译的 .c 文件中 |
| DTS 有但宏未定义 | 1. project.mk 中添加对应宏定义<br>2. 或从 dts.c 中移除未使用的配置块 |
| 缺少 DTS 配置 | 1. 在 dts.c 中添加对应传感器的 #ifdef 块和硬件参数 |
| overlay 配置不匹配 | 1. 更新 overlay_sensor.h 中的传感器名称与实际使用的一致 |
| 库文件缺失 | 1. 确认库文件是否应存在<br>2. 或检查 `CFG_MAG_PROJECT_NAME` 路径是否正确 |

## 常见问题模式

以下是已验证到的高频问题模式，检查时需特别注意：

1. **宏在 project.mk 设为 yes 但 sensorhub.mk 中无 ifeq 块** — 这是最常见问题。此类宏可能：
   - 仅在 chre.mk 中使用（但 CHRE_SUPPORT 通常 = no，导致实际不生效）
   - 仅通过 #ifdef 在 C 源码中生效（需在源代码目录中搜索确认）
   - 完全没有被任何代码引用（死宏）

2. **器件宏指向的 .c 文件与 C 源码中 #ifdef 的文件不一致** — 如 `CFG_MN78911_SUPPORT` 编译 `mn78xxx.c`，但 `CFG_MN78911_PS_CHK_SUN` 的 `#ifdef` 只在 `tl_mn78xxx.c` 中

3. **DTS 中有配置但 project.mk 中宏未定义** — DTS 预留了但未启用

4. **overlay_sensor.h 中配置的传感器与 project.mk 中实际使用的完全不同** — overlay 启用时会导致编译错误的驱动

5. **宏命名不一致** — 部分宏使用 `CFG_XXX_SUPPORT`，部分使用 `CFG_XXX`（无 _SUPPORT 后缀）。如 `CFG_MN78911_PS_CHK_SUN` 不是 `CFG_MN78911_PS_CHK_SUN_SUPPORT`。DTS 和 C 源码中的 `#ifdef` 必须精确匹配宏名
