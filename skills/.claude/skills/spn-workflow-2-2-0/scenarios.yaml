schema_version: "1.0"
domain: "connectivity/spn"

scenarios:
  - id: spn-workflow-intake
    name: "SPN Jira 与日志 intake"
    owner: connectivity_team
    symptoms:
      - "分析 SPN Jira"
      - "运营商名称 Jira 单"
      - "displayName Jira"
      - "手动搜网运营商名"
      - "状态栏网络名 Jira"
      - "MVNO SPN Jira"
      - "云网 SPN Jira"
      - "SPN 故障分析"
      - "读 Jira 和日志"
    keywords:
      - spn-workflow
      - SPN
      - displayName
      - jira-reader
      - operator-name
    languages: [java, kotlin, xml]
    scope:
      coding_only: false
      variants: ["intake-only", "intake-with-logs"]
    validation:
      runner: remote
      gate_rules: ["spn.logs.readonly"]
      human_gate: false
    references:
      - "connectivity/sub/spn/references/workflow.md"
      - "connectivity/sub/spn/workflow.yaml"

  - id: spn-workflow-analysis
    name: "SPN 日志分析与平台分流"
    owner: connectivity_team
    symptoms:
      - "分析 SPN 显示问题"
      - "运营商名称不对"
      - "手动搜网 MCCMNC"
      - "状态栏运营商名错误"
      - "锁屏网络名"
      - "MVNO 子品牌名"
      - "云网 SPN 不刷新"
      - "displayNameSource 异常"
      - "SPN 注入未生效"
    keywords:
      - spn-fault-analysis
      - MtkSpnOverride
      - QcomSpnOverride
      - lookupOperatorName
      - SERVICE_PROVIDERS_UPDATED
    languages: [java, kotlin]
    scope:
      coding_only: false
      variants: ["analysis-only", "platform-routing"]
    validation:
      runner: remote
      gate_rules:
        - spn.no.patch.without.analysis
        - spn.platform.single.path
      human_gate: false
    references:
      - "connectivity/sub/spn/references/workflow.md"
      - "connectivity/sub/spn/references/mtk.md"
      - "connectivity/sub/spn/references/qcom.md"
      - "connectivity/sub/spn/references/report-template.md"
      - "connectivity/sub/spn/workflow.yaml"

  - id: spn-workflow-patch
    name: "SPN 源码修复与 diff 交付"
    owner: connectivity_team
    symptoms:
      - "修 SPN 代码"
      - "改 displayName"
      - "改 ServiceStateTracker"
      - "改 MtkServiceStateTracker"
      - "改 SubscriptionManagerService"
      - "生成 SPN 修复 diff"
      - "方案 C 时序修复"
    keywords:
      - spn-code-edit
      - spn-conf
      - plmn-conf
      - telephony
    languages: [java, kotlin, xml]
    scope:
      coding_only: true
      variants: ["patch-only", "patch-with-diff-review"]
    validation:
      runner: remote
      gate_rules:
        - spn.no.patch.without.analysis
        - spn.platform.single.path
        - spn.minimal.scope
      human_gate: true
    references:
      - "connectivity/sub/spn/references/workflow.md"
      - "connectivity/sub/spn/workflow.yaml"

  - id: spn-workflow-submit
    name: "SPN 分支解析与 Gerrit 提交"
    owner: connectivity_team
    symptoms:
      - "提交 SPN"
      - "推送 gerrit SPN"
      - "SPN 自检"
      - "git提交 telephony"
      - "push到gerrit"
      - "追加 SPN patch set"
    keywords:
      - spn-submit
      - gerrit
      - commit-message
      - branch-server
    languages: [java, kotlin, shell]
    scope:
      coding_only: false
      variants: ["branch-plan", "create-cr", "upload-patch-set"]
    validation:
      runner: remote
      gate_rules:
        - spn.no.submit.without.diff.approval
        - spn.branch.single.target
        - spn.no.secret.paths
      human_gate: true
    references:
      - "connectivity/sub/spn/references/submission.md"
      - "connectivity/sub/spn/workflow.yaml"
