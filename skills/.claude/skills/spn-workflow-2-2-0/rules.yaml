schema_version: "1.0"

rules:
  - id: spn.logs.readonly
    severity: BLOCK
    description: "用户提供的 Jira 附件与日志只读，不修改或覆盖"
    rationale: "原始日志是故障证据，改写会破坏分析可信度"
    check:
      type: custom
    applies_to:
      risk_tags: [spn, telephony]

  - id: spn.no.patch.without.analysis
    severity: BLOCK
    description: "未完成平台识别与证据化分析前不得改码"
    rationale: "SPN 链路跨 Framework/Vendor/TeleService，未分析易改错平台或层"
    check:
      type: custom
    applies_to:
      layers: [framework, app]
      languages: [java, kotlin]

  - id: spn.no.submit.without.diff.approval
    severity: BLOCK
    description: "用户未明确确认 diff 前不得 commit/push/Gerrit"
    rationale: "SPN 改动影响面大，必须经 diff review"
    check:
      type: custom
    applies_to:
      risk_tags: [spn, gerrit]

  - id: spn.platform.single.path
    severity: BLOCK
    description: "MTK 与 QCOM telephony 修复路径不得混搭"
    rationale: "两套 SPN 实现独立，混改会导致编译或运行时异常"
    check:
      type: custom
    applies_to:
      layers: [framework, app]
      languages: [java, kotlin]

  - id: spn.branch.single.target
    severity: BLOCK
    description: "每个 repo project 必须解析出唯一目标分支且与 Jira 版本一致"
    rationale: "Jira 版本名不等于 Gerrit 分支，歧义分支会导致 CR 落错维护线"
    check:
      type: custom
    applies_to:
      risk_tags: [spn, gerrit]

  - id: spn.minimal.scope
    severity: WARN
    description: "只修改根因相关文件，不扩大到无关清理"
    rationale: "SPN CR 应便于审查和回合"
    check:
      type: custom
    applies_to:
      layers: [framework, app]
      languages: [java, kotlin, xml]

  - id: spn.no.secret.paths
    severity: BLOCK
    description: "报告、skill 与提交材料不得包含 token、webhook、设备 SN 或个人绝对路径"
    rationale: "SPN 工作流产物可能进入 Jira/Gerrit 评论"
    check:
      type: content_absent
      pattern: "open-apis/bot/v2/hook|https://open.feishu.cn|HARNESS_.*_PASSWORD"
      scope: "connectivity/sub/spn"
    applies_to:
      risk_tags: [spn]

  - id: spn.dashboard.record.on.analyzed
    severity: BLOCK
    description: "进入 ANALYZED 后必须执行 assets/spn_dashboard_cli.py record 并上传 spn/dashboard/record"
    rationale: "团队 SPN 看板依赖 ANALYZED 上报；不上报则无法统计他人使用 skill 的结果"
    check:
      type: custom
    applies_to:
      risk_tags: [spn, telemetry]

  - id: spn.dashboard.record.on.submitted
    severity: BLOCK
    description: "Gerrit 提交成功进入 SUBMITTED 后必须再次 record（含 change_url）"
    rationale: "提交闭环需进入看板，便于统计修复完成率"
    check:
      type: custom
    applies_to:
      risk_tags: [spn, gerrit, telemetry]
