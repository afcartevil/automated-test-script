# CPU 频率策略（perfLockAcq / touch_boost）、DDR、图层帧率、thermal 限频

categories:
  touch_boost:
    description: 滑动提频 recordCPUFreqInfo（touch_boost / UX_SCROLLING）
    logs: [main_log]
    patterns:
      - id: record_cpu_freq_touch
        keywords: [recordCPUFreqInfo]
        regex: 'libPowerHal: \[recordCPUFreqInfo\] set (?P<body>.+)'
        note: body 中含 touch_boost 或 MTKPOWER_HINT_UX_SCROLLING 视为滑动提频

  perf_lock_acq:
    description: libPowerHal perfLockAcq，与 touch_boost 配对取 duration
    logs: [main_log, sys_log]
    patterns:
      - id: perf_lock_acquire
        keywords: [perfLockAcq]
        regex: '\[perfLockAcq\]\s+idx:(?P<idx>\d+)\s+hdl:(?P<hdl>\d+)\s+hint:(?P<hint>-?\d+)\s+pid:(?P<pid>\d+)\s+tid:(?P<tid>\d+)\s+duration:(?P<duration>\d+)\s+lock_user:(?P<lock_user>[^=]+)\s+=>\s+ret_hdl:(?P<ret_hdl>\d+)'
        example: '[perfLockAcq] idx:6 hdl:7432 hint:43 pid:1268 tid:1268 duration:3000 lock_user:vendor.mediatek => ret_hdl:7432'

  ddr_freq:
    description: DVFSRC DDR 档位
    logs: [main_log]
    patterns:
      - id: dvfsrc_opp
        keywords: [setDvfsrcDevFreqOpp]
        regex: 'libPowerHal: \[setDvfsrcDevFreqOpp\] opp:(?P<opp>\d+),\s*freq:(?P<freq>\d+)'
        example: 'libPowerHal: [setDvfsrcDevFreqOpp] opp:2, freq:3094000000'

  buffer_queue_fps:
    description: SurfaceFlinger BufferQueueProducer queueBuffer 帧率采样
    logs: [main_log]
    patterns:
      - id: queue_buffer_fps
        keywords: [BufferQueueProducer, queueBuffer]
        regex: 'BufferQueueProducer: \[(?P<layer>.+?)\]\(this:.*?queueBuffer:\s+fps=(?P<fps>[-\d.]+)\s+dur=(?P<dur>[-\d.]+)\s+max=(?P<max>[-\d.]+)\s+min=(?P<min>[-\d.]+)'
        example: 'BufferQueueProducer: [a5821ad SurfaceView[com.mobile.legends/...](BLAST)#831](...) queueBuffer: fps=59.74 dur=1004.41 max=23.66 min=9.91'

  thermal_engine_limits:
    description: tran_thermal_engine 温控限频
    logs: [main_log, sys_log]
    patterns:
      - id: tran_thermal_engine
        keywords: [tran_thermal_engine]
        regex: '\[tran_thermal_engine\].*?temp=(?P<temp>[\d.]+)C?.*?fgAct=(?P<fg_act>[^,]+).*?limits\{(?P<limits>[^}]+)\}'
        example: '[tran_thermal_engine] event=updateForegroundPackage, temp=40.088C, fgAct=com.debug.loggerui.MainActivity, limits{cluster0=1850000,cluster1=2050000,...}'

# idx 策略说明（MTK PowerHAL 常见档位，可按项目扩展）
perf_lock_idx_labels:
  "0": 通用/系统提频
  "1": FPSGO/游戏场景
  "3": 显示/触控相关
  "4": 多媒体/编解码
