# 各核 CPU usage 平台标准基线（固化对比依据）
#
# 用途：game_kernel_cpu/SKILL.md — 8 核 CPU usage 平台标准。
# [K] 块中 Cpus Usage 固定输出 8 个核的占用（如 [38], [31], [30], [31], [14], [13], [10], [7]）。
# 在 T_game（优先 stable 阶段）内统计各核平均占用与波动率，与同平台标准对比判断功耗是否异常。
#
# 波动率定义（与步骤 1 一致）：
#   fluctuation_pp = max(采样值) - min(采样值)   # 绝对百分点
#   fluctuation_rate_pct = fluctuation_pp / avg_usage * 100  （avg_usage > 0 时）

version: 1

thresholds:
  # 无平台标准条目时的兜底：同场景各核波动超过该值（绝对百分点）标可疑
  default_fluctuation_pp_max: 5
  # 实测 avg 与标准 avg 偏差超过该值（绝对百分点）标可疑
  default_avg_delta_pp_max: 5
  # 实测波动率与标准波动率偏差超过该值（绝对百分点）标可疑
  default_fluctuation_delta_pp_max: 3
  # 优先用 stable 阶段样本；stable 不足时降级用全 T_game
  min_samples_for_stats: 3

# 平台 / 项目标准条目。按 soc_model + game_package 匹配；* 表示通配。
# 各团队用 golden 版本或历史达标场景标定后填入 standard_avg / standard_fluctuation_pp。
platform_standards:
  - id: example_mtk_8core
    soc_model: "*"              # 如 MT6899、MT6989；未识别 SOC 时用 *
    game_package: "*"           # 如 com.tencent.ig；未区分游戏时用 *
    note: "示例骨架，请用同平台 golden 场景实测值替换"
    cores:
      - core_id: 0
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 1
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 2
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 3
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 4
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 5
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 6
        standard_avg: null
        standard_fluctuation_pp: null
      - core_id: 7
        standard_avg: null
        standard_fluctuation_pp: null

# ---------------------------------------------------------------------------
# 无平台 / 项目标准数据时的处理（降级策略）
# ---------------------------------------------------------------------------
# 当 platform_standards 中 standard_avg / standard_fluctuation_pp 均为 null，
# 或尚未标定 golden 场景时，parser 不阻塞，按以下顺序降级：
#
# 1. 仍输出各核实测统计（avg_usage、fluctuation_pp、fluctuation_rate_pct 等），
#    供人工对比或后续入库为标准。
# 2. 各核 level 判定改用 thresholds 兜底 + T_pre 同核对比：
#    - fluctuation_pp > default_fluctuation_pp_max(5) → suspect
#    - T_game 同核 avg 相对 T_pre 抬升 > default_avg_delta_pp_max(5) → suspect
#    - [K] 采样点 < min_samples_for_stats(3) → unknown
#    - 无标准且无 T_pre 可比数据 → unknown（不得标 high confidence 定责）
# 3. 在 game_power_compare_summary.json 的 notes 写入：
#    「无平台各核标准，仅使用同场景波动与 T_pre 对比兜底」。
# 4. 主因排序不得仅凭各核 CPU 给出 high confidence；需结合异常进程、
#    频率策略、后台行为等交叉证据。
# 5. 建议补齐标准的途径（任选）：
#    - 同平台 + 同游戏 golden 版本跑一轮，把 stable 段各核均值/波动写入本文件；
#    - 用历史达标场景的 game_power_compare_summary.json 回填；
#    - 对比机 / 电流仪同条件复测后标定。
#
# 共同进程基线（baseline-processes.yaml）不依赖平台标准，始终生效。

# 输出字段（写入 game_power_compare_summary.json 的 cpu_core_usage_stats）
output_metrics:
  per_core:
    - core_id
    - sample_count
    - avg_usage
    - min_usage
    - max_usage
    - fluctuation_pp
    - fluctuation_rate_pct
    - standard_avg
    - standard_fluctuation_pp
    - avg_delta_pp
    - fluctuation_delta_pp
    - level          # normal | suspect | abnormal | unknown
  aggregate:
    - total_samples
    - phase          # stable | T_game | degraded
    - platform_match_id
    - abnormal_core_count
