# 游戏场景共同进程基线（固化对比依据）
#
# 用途：game_kernel_cpu/SKILL.md — Kernel [K] CPU 与线程。
# 这些进程在所有游戏场景中都会出现，CPU 占比随项目 / CPU 平台不同而不同，
# 但在「同一个游戏场景」内应保持相对稳定。
#
# 判定原则：
#   - 基线进程 + 主游戏进程 = 预期进程白名单，不计入异常。
#   - 同一场景内，基线进程各 [K] 采样点 CPU 占比波动 <= baseline_fluctuation_pct（绝对百分点）视为正常，超过视为异常。
#   - 不在白名单内的进程，一律视为异常进程，需统计出现次数 / 占比 / 连续性 / 平均与峰值占比。

version: 1

thresholds:
  # 同一场景内基线进程 CPU 占比波动阈值（绝对百分点），<= 视为正常
  baseline_fluctuation_pct: 5
  # 异常进程连续命中采样点数，>= 视为“持续(continuous)”，否则为“瞬时峰值(transient)”
  continuous_sample_count: 2
  # 线程排查：多轮出现占比阈值（非每轮均出现；如 13/23 轮）
  persistent_min_sample_ratio: 0.4
  persistent_min_occurrence: 3

# 游戏子进程/线程名后缀（kernel [K] 常截断为 ds:UnityKillsMe 等形式，与包名 com.xxx:UnityKillsMe 对应）
game_thread_suffixes:
  - UnityKillsMe
  - MainThread-UE4
  - UnityMain
  - UE4
  - il2cpp

# 共同系统进程：所有游戏场景共有；占比随项目/平台不同，但同场景内应稳定。
# match: exact = 进程名完全匹配；prefix = 按前缀匹配（兼容平台/PID 差异）。
common_processes:
  - name: system_server
    match: exact
  - name: surfaceflinger
    match: exact
  - name: audioserver
    match: exact
  - name: logd
    match: exact
  - name: "smartpanel:game"
    match: exact
  - name: "binder:"
    match: prefix
    note: binder 线程编号随 PID 变化（如 binder:1928_3），按前缀匹配 binder:1 / binder:2 / binder:3 等
  - name: "composer@"
    match: prefix
    note: HWC composer 版本随平台不同（如 composer@3.4-se），按前缀匹配

# 主游戏进程：由 base_game_time_window 识别的游戏包名确定，同属预期进程；
# 不计入异常，但需单独统计其占比与稳定性。
main_game_process:
  resolved_from: game_package   # 取 base_game_time_window 识别到的游戏包名
  include_subprocess: true      # 含 <package>:xxx 子进程（如 com.tencent.ig:plugin）

# 异常进程统计字段（写入 game_power_compare_summary.json 的 abnormal_processes[]）
abnormal_process_metrics:
  - occurrence_count   # T_game 内出现的 [K] 采样点次数
  - sample_ratio       # occurrence_count / T_game 总采样点数
  - continuity         # continuous | transient，并记录最长连续段
  - longest_run        # 最长连续命中采样点数
  - time_ranges        # 命中时间区间列表
  - avg_usage          # 平均 CPU 占比
  - max_usage          # 峰值 CPU 占比

# 备注：
# - 本文件用于跨场景 / 跨版本 / 跨项目对比；新增稳定共有进程时在 common_processes 追加，并注明匹配方式。
# - 平台特有但确认属于系统常驻的进程，可按项目在此扩展，避免误判为异常。
