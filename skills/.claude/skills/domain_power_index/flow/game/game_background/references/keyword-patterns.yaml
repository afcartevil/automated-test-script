# 后台行为关键词；阈值见 background-behavior-thresholds.yaml

primary_logs: [events_log]
supplement_logs: [main_log, sys_log]

categories:
  process_lifecycle:
    description: 进程拉起与退出
    patterns:
      - id: event_proc_start
        status: active
        logs: [events_log, main_log, sys_log]
        keywords: [am_proc_start, Start proc]
        category: process_start
      - id: event_proc_died
        status: active
        logs: [events_log, main_log, sys_log]
        keywords: [am_proc_died, am_kill, Killing]
        category: process_died
      - id: event_service_restart
        status: active
        logs: [events_log]
        keywords: [am_schedule_service_restart]
        category: service_restart
      - id: event_am_pss
        status: active
        logs: [events_log]
        keywords: [am_pss]
        category: memory_pss

  investigation:
    description: 四步后台排查（T_game）
    patterns:
      - id: step1_proc_lifecycle
        status: active
        logs: [events_log]
        keywords: [am_proc_start, am_proc_died, am_schedule_service_restart]
        category: process_autostart
      - id: step2_am_pss
        status: active
        logs: [events_log]
        keywords: [am_pss]
        category: memory_pss
      - id: step3_download
        status: active
        logs: [main_log]
        keywords: [Download, GCloud]
        category: background_download
      - id: step4_gc_storm
        status: active
        logs: [main_log]
        keywords: [concurrent mark]
        category: gc_storm

  activity_lifecycle:
    description: Activity 前后台切换
    patterns:
      - id: event_wm_resume
        status: active
        logs: [events_log, main_log, sys_log]
        keywords: [wm_set_resumed_activity, wm_set_resume, Displayed]
        category: activity_resume
      - id: event_wm_pause
        status: active
        logs: [events_log, main_log, sys_log]
        keywords: [wm_set_paused_activity, wm_set_pause]
        category: activity_pause

  service:
    description: 后台 Service 启动与绑定
    patterns:
      - id: service_start
        status: active
        logs: [main_log, sys_log]
        keywords: [startService, ActiveServices]
        category: service_start
      - id: service_bind
        status: active
        logs: [main_log, sys_log]
        keywords: [bindService]
        category: service_bind
      - id: foreground_service
        status: active
        logs: [main_log, sys_log]
        keywords: [foreground service, FGS, ServiceRecord]
        category: foreground_service

  broadcast:
    description: 广播分发
    patterns:
      - id: broadcast_dispatch
        status: active
        logs: [main_log, sys_log]
        keywords: [BroadcastQueue, sendBroadcast, ReceiverList]
        category: broadcast

  scheduled_wakeup:
    description: Alarm / Job 定时唤醒
    patterns:
      - id: alarm_wakeup
        status: active
        logs: [main_log, sys_log]
        keywords: [AlarmManager, setExact, wakeup alarm]
        category: alarm
      - id: job_scheduler
        status: active
        logs: [main_log, sys_log]
        keywords: [JobScheduler, JobServiceContext, WorkManager, SyncManager]
        category: job

  wakelock:
    description: WakeLock 持锁唤醒
    patterns:
      - id: wakelock_acquire_release
        status: active
        logs: [main_log, sys_log]
        keywords: [WakeLock, PowerManagerService, PARTIAL_WAKE_LOCK, wake_lock]
        category: wakelock

  location_sensor:
    description: 定位与传感器后台采样
    patterns:
      - id: location_gnss
        status: active
        logs: [main_log, sys_log]
        keywords: [LocationManagerService, Gnss, GPS]
        category: location
      - id: sensor_listener
        status: active
        logs: [main_log, sys_log]
        keywords: [SensorService, registerListener, accelerometer, gyro]
        category: sensor

  audio_background:
    description: 非游戏音频占用（与 game_volume 分工）
    patterns:
      - id: audio_service_track
        status: active
        logs: [main_log, sys_log]
        keywords: [AudioService, AudioFlinger, MediaSession, AudioTrack, startOutput]
        category: audio

  network_scan:
    description: WiFi / BT 扫描
    patterns:
      - id: wifi_bt_scan
        status: active
        logs: [main_log, sys_log]
        keywords: [WifiScanner, WifiConnectivityManager, BluetoothLeScanner, NetworkAgent]
        category: network_scan

  crash_anr:
    description: 崩溃与 ANR
    patterns:
      - id: crash_anr
        status: active
        logs: [events_log, main_log, sys_log]
        keywords: [am_crash, am_anr, ANR, FATAL EXCEPTION, tombstone]
        category: crash

  gc_binder:
    description: GC / Binder 风暴
    patterns:
      - id: gc_storm
        status: active
        logs: [main_log, sys_log]
        keywords: [GC, gc_concurrent, Background concurrent copying GC, concurrent mark]
        category: gc
      - id: binder_storm
        status: active
        logs: [main_log, sys_log]
        keywords: [Binder, binder transaction]
        category: binder

  mtk_oem:
    description: MTK / 传音 OEM 冻结与游戏下载
    patterns:
      - id: usf_hiber_freeze
        status: active
        logs: [main_log, sys_log, events_log]
        keywords: [Usf_Hiber, freeze uid, fastFreeze]
        category: oem_freeze
      - id: usf_hiber_unfreeze
        status: active
        logs: [main_log, sys_log, events_log]
        keywords: [Usf_Hiber, unfreeze uid]
        category: oem_unfreeze
      - id: game_resource_download
        status: active
        logs: [main_log, sys_log]
        keywords: [DownloaderActivity, download, resource]
        category: game_download
