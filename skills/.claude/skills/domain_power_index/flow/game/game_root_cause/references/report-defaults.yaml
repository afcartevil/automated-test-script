# 澄清报告默认展示配置（可被 CLI --meta-json 覆盖）

report:
  title_suffix: 功耗澄清报告
  default_priority: P2
  icon: ti-device-gamepad-2

test_condition_display:
  scene:
    icon: ti-device-gamepad-2
    label: 测试场景
    standard: 游戏前台稳定段
  airplane:
    icon: ti-plane
    label: 飞行模式
  nfc:
    icon: ti-nfc
    label: NFC
  bt:
    icon: ti-bluetooth
    label: 蓝牙
  gesture_nav:
    icon: ti-hand-stop
    label: 手势
  auto_brightness:
    icon: ti-sun-low
    label: 自动背光
  logger:
    icon: ti-sparkles
    label: 灯效
  brightness:
    icon: ti-sun
    label: 亮度
    standard: 按项目查表
  volume:
    icon: ti-volume
    label: 音量
    standard: 按项目查表
  wifi:
    icon: ti-wifi
    label: 网络
  sim_data:
    icon: ti-sim-card
    label: SIM/数据
  gps:
    icon: ti-map-pin
    label: GPS
  auto_rotate:
    icon: ti-rotate
    label: 自动旋转
  refresh_rate:
    icon: ti-refresh
    label: 刷新率

hardware_rows:
  - id: screen
    label: 屏
    icon: ti-device-mobile
    color: blue
    meta_key: screen_delta_ma
    default_reason: 已知软硬件功耗差
    default_optimization: 纳入已知差台账
  - id: speaker
    label: 喇叭
    icon: ti-volume
    color: purple
    meta_key: speaker_delta_ma
    default_reason: 已知软硬件功耗差
    default_optimization: 纳入已知差台账
  - id: cpu
    label: CPU平台
    icon: ti-cpu
    color: coral
    meta_key: cpu_delta_ma
    default_reason: 已知软硬件功耗差
    default_optimization: 纳入已知差台账
  - id: rf
    label: 射频
    icon: ti-antenna
    color: amber
    meta_key: rf_delta_ma
    default_reason: 待仪器对比补充
    default_optimization: —
