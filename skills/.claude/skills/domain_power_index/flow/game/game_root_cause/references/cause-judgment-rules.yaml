# 游戏功耗澄清 — 原因判断规则（YAML 配规则，Python 引擎执行）
# 数据源：步骤 12 game_power_compare_summary.json + analysis/game_*.json
# path 为点分路径；source 缺省为 summary
#
# 诊断四类（初步诊断）+ 报告器件拆解：
# 1 测试手法不符（含「日志不全」子类）
# 2 器件差异（报告拆解表，非初步诊断四类之一）
# 3 软件策略差异
# 4 功能差异
# 5 异常问题
#
# 步骤对标见 references/cause-attribution-mapping.yaml

thresholds:
  min_game_duration_seconds: 180
  short_game_seconds: 180
  # 双机对比：T_game 时长差超过该秒数则判定「测试时长不一致」
  dual_duration_tolerance_seconds: 60
  gc_storm_count: 15
  broadcast_storm_count: 20
  alarm_storm_count: 15
  abnormal_process_count: 3
  background_suspicious_packages: 5
  background_autostart_packages: 5
  background_single_duration_seconds: 30
  game_download_count: 1
  weak_network_level: weak
  wifi_weak_rssi_dbm: -90
  cellular_weak_rsrp_dbm: -110
  brightness_warn_high_pct: 55
  brightness_warn_low_pct: 45
  volume_warn_high_pct: 55
  volume_warn_low_pct: 45
  freq_throttle_events: 1
  thermal_rise_delta_c: 3.0
  hardware_delta_ma_notice: 30
  abnormal_cpu_usage_pct: 10
  process_cpu_over_baseline_pct: 20
  memory_over_baseline_pct: 10

categories:
  test_methodology:
    order: 1
    title: 测试手法不符
    patterns:
      # —— 日志不全（步骤1 日志识别 / 步骤2 场景识别）——
      - id: log_no_logs
        subcategory: 日志不全
        label: 无日志
        flow_step: 1
        priority: P0
        check_type: composite
        op: or
        conditions:
          - source: summary
            path: log_inventory.no_logs
            op: eq
            value: true
          - source: game_time_window
            path: log_inventory.no_logs
            op: eq
            value: true

      - id: log_incomplete
        subcategory: 日志不全
        label: 监测日志不完整
        flow_step: 1
        priority: P1
        check_type: composite
        op: and
        conditions:
          - source: summary
            path: log_inventory.no_logs
            op: eq
            value: false
          - check_type: composite
            op: or
            conditions:
              - source: summary
                path: log_inventory.incomplete
                op: eq
                value: true
              - source: summary
                path: log_inventory.missing_for_report
                op: not_empty
              - source: game_time_window
                path: log_inventory.incomplete
                op: eq
                value: true

      - id: log_no_game_scene
        subcategory: 日志不全
        label: 日志中不包含测试场景时间段
        flow_step: 2
        priority: P0
        check_type: composite
        op: or
        conditions:
          - source: game_time_window
            path: status
            op: in
            value: [need_confirm, blocked, failed]
          - source: game_time_window
            path: game_window.start
            op: empty
          - source: summary
            path: game_window.start
            op: empty

      - id: log_scene_incomplete
        subcategory: 日志不全
        label: 场景时段日志覆盖不全
        flow_step: 2
        priority: P1
        check_type: composite
        op: and
        conditions:
          - source: game_time_window
            path: game_window.start
            op: not_empty
          - source: game_time_window
            path: log_inventory.scene_coverage_missing
            op: not_empty

      - id: log_duration_short
        subcategory: 日志不全
        label: 测试场景时长小于3min
        flow_step: 2
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: summary
            path: game_window.duration_seconds
            op: lt
            value_ref: min_game_duration_seconds
          - source: game_precondition
            path: game_window.duration_seconds
            op: lt
            value_ref: min_game_duration_seconds
          - source: game_time_window
            path: game_window.duration_seconds
            op: lt
            value_ref: min_game_duration_seconds

      # —— 步骤3 前置条件 ——
      # 注：log_duration_mismatch（双机 T_game 时长不一致）由澄清报告双机层注入，见 cause_snapshot_lib

      - id: precond_mismatch
        subcategory: 前置条件
        label: 前置条件与测试用例标准不相符
        flow_step: 3
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_precondition
            path: test_conditions.completeness
            op: in
            value: [poor, partial]
          - source: summary
            path: test_conditions.completeness
            op: in
            value: [poor, partial]

      - id: precond_network_wifi_uses_data
        subcategory: 前置条件
        label: WiFi场景使用数据
        flow_step: 3
        priority: P1
        check_type: tag_scenario
        source: game_precondition
        scenario_network: wifi
        tag_id: data
        bad_values: [ON, 开启]

      - id: precond_network_data_uses_wifi
        subcategory: 前置条件
        label: 数据场景使用WiFi
        flow_step: 3
        priority: P1
        check_type: tag_scenario
        source: game_precondition
        scenario_network: data
        tag_id: wifi
        bad_values: [ON, 开启]

      - id: precond_auto_brightness_on
        subcategory: 前置条件
        label: 自动背光被打开
        flow_step: 3
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_brightness
            path: pre_test_brightness.auto_brightness_likely
            op: eq
            value: true
          - check_type: tag_value
            source: game_precondition
            tag_id: brightness
            values: [自动, AUTO, auto]

      # —— 步骤5 亮度（手法）——
      - id: method_brightness_testcase
        subcategory: 亮度
        label: 亮度大小不符
        flow_step: 5
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_brightness
            path: brightness_investigation.step1_test_setting.aligned_with_standard
            op: eq
            value: false
          - source: game_brightness
            path: brightness_investigation.step1_test_setting.status
            op: in
            value: [bad, warn, fail]
          - check_type: tag_status_in
            source: game_precondition
            tag_id: brightness
            statuses: [warn, bad]

      - id: method_brightness_thermal_dim
        subcategory: 亮度
        label: 触发温控降背光
        flow_step: 5
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_brightness
            path: brightness_investigation.step5_thermal_control.test_methodology_issue
            op: eq
            value: true
          - source: game_brightness
            path: brightness_investigation.step5_thermal_control.triggered
            op: eq
            value: true
          - source: game_brightness
            path: thermal_brightness.test_methodology_issue
            op: eq
            value: true
          - source: game_thermal
            path: thermal_summary.during_game.thermal_backlight
            op: eq
            value: true

      # —— 步骤6 音量 ——
      - id: method_volume_size
        subcategory: 音量
        label: 音量大小不符
        flow_step: 6
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_volume
            path: volume_investigation.step1_test_setting.status
            op: in
            value: [bad, warn, fail]
          - source: game_volume
            path: volume_investigation.step1_test_setting.aligned_with_standard
            op: eq
            value: false
          - check_type: tag_status_in
            source: game_precondition
            tag_id: volume
            statuses: [warn, bad]

      - id: method_volume_channel
        subcategory: 音量
        label: 音量通道不符
        flow_step: 6
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_volume
            path: pre_test_volume.baseline.channel_mismatch
            op: eq
            value: true
          - source: game_volume
            path: volume_investigation.step1_test_setting.channel_mismatch
            op: eq
            value: true

      # —— 步骤7 CPU/GPU/DDR：thermal 限频（手法）——
      - id: method_cpu_thermal_throttle
        subcategory: CPU/GPU/DDR
        label: thermal导致的限频
        flow_step: 7
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_cpu_gpu_ddr
            path: cpu_gpu_ddr_investigation.step5_thermal_throttle.throttled_in_game
            op: eq
            value: true
          - source: game_cpu_gpu_ddr
            path: thermal_throttle.detected
            op: eq
            value: true
          - source: game_thermal
            path: thermal_summary.during_game.freq_throttle
            op: eq
            value: true

      # —— 步骤9 后台：下载（手法）——
      - id: method_background_download
        subcategory: 后台应用
        label: 后台下载行为
        flow_step: 9
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_background
            path: background_investigation.step3_background_download.download_during_game
            op: eq
            value: true
          - source: game_background
            path: background_investigation.step3_background_download.gcloud_tencent_download_during_game
            op: eq
            value: true
          - source: game_background
            path: background_investigation.step3_background_download.t_game_download_count
            op: gte
            value_ref: game_download_count
          - source: game_background
            path: category_breakdown_T_game.game_download
            op: gte
            value_ref: game_download_count

  hardware_difference:
    order: 2
    title: 器件差异
    patterns:
      - id: hw_screen_delta
        subcategory: 屏
        label: 屏器件功耗差异
        priority: P1
        check_type: meta_delta_gte
        meta_key: screen_delta_ma
        threshold_ref: hardware_delta_ma_notice

      - id: hw_speaker_delta
        subcategory: 喇叭
        label: 喇叭/音频响度功耗不一致
        priority: P1
        check_type: meta_delta_gte
        meta_key: speaker_delta_ma
        threshold_ref: hardware_delta_ma_notice

      - id: hw_cpu_platform
        subcategory: CPU平台
        label: 不同CPU平台能效差异
        priority: P1
        check_type: composite
        op: and
        conditions:
          - source: report_meta
            path: competitor_soc_model
            op: not_empty
          - source: summary
            path: analysis_meta.soc_model
            op: not_empty
          - source: report_meta
            path: competitor_soc_model
            op: ne_path
            other_source: summary
            other_path: analysis_meta.soc_model

      - id: hw_rf_modem
        subcategory: WiFi/Modem
        label: WiFi/modem器件差异导致的功耗差异
        priority: P2
        check_type: meta_delta_gte
        meta_key: rf_delta_ma
        threshold_ref: hardware_delta_ma_notice

  optimization_strategy:
    order: 3
    title: 软件策略差异
    patterns:
      - id: opt_backlight_2_0
        subcategory: 背光2.0
        label: 背光2.0是否生效（仅最大亮度场景）
        flow_step: 5
        priority: P1
        check_type: composite
        op: and
        conditions:
          - source: game_brightness
            path: brightness_investigation.step3_backlight_2_0.skipped
            op: eq
            value: false
          - check_type: composite
            op: or
            conditions:
              - source: game_brightness
                path: brightness_investigation.step3_backlight_2_0.applied
                op: eq
                value: true
              - source: game_brightness
                path: brightness_investigation.step3_backlight_2_0.effective
                op: eq
                value: true
              - source: game_brightness
                path: brightness_investigation.step3_backlight_2_0.status
                op: in
                value: [active, applied, hit, observed, miss]
              - source: game_brightness
                path: brightness_investigation.step3_backlight_2_0.coverage
                op: eq
                value: ok

      - id: opt_aal_strategy
        subcategory: AAL背光
        label: AAL背光策略是否生效
        flow_step: 5
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_brightness
            path: brightness_investigation.step4_aal_strategy.effective
            op: eq
            value: true
          - source: game_brightness
            path: brightness_investigation.step4_aal_strategy.active
            op: eq
            value: true
          - source: game_brightness
            path: brightness_investigation.step4_aal_strategy.effective_after_game_start
            op: eq
            value: true

      - id: opt_refresh_rate
        subcategory: 屏幕刷新率
        label: 屏幕刷新率（PowerHal / hwcomposer）
        flow_step: 5
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_brightness
            path: brightness_investigation.step6_refresh_rate.coverage
            op: eq
            value: ok
          - source: game_brightness
            path: brightness_investigation.step6_refresh_rate.status
            op: in
            value: [observed, ok]
      # —— 步骤11 thermal：降亮度 / 限频分拆（gameMode  alone 不算生效）——
      - id: opt_thermal_backlight_dim
        subcategory: thermal降亮度
        label: thermal降亮度是否生效
        flow_step: 11
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_thermal
            path: thermal_report.backlight_dim.effective
            op: eq
            value: true
          - source: game_thermal
            path: thermal_summary.during_game.thermal_backlight
            op: eq
            value: true

      - id: opt_thermal_freq_throttle
        subcategory: thermal限频
        label: thermal限频是否生效
        flow_step: 11
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_thermal
            path: thermal_report.freq_throttle.effective
            op: eq
            value: true
          - source: game_thermal
            path: thermal_summary.during_game.freq_throttle
            op: eq
            value: true
          - source: game_cpu_gpu_ddr
            path: cpu_gpu_ddr_investigation.step5_thermal_throttle.throttled_in_game
            op: eq
            value: true

      - id: opt_touch_boost_vs_competitor
        subcategory: 滑动提频
        label: 滑动提频CPU频率和时长与竞品存在差异
        flow_step: 7
        priority: P1
        check_type: requires_meta
        meta_key: touch_boost_diff
        meta_value: true

      - id: opt_ddr_vs_competitor
        subcategory: DDR
        label: DDR频率与竞品存在差异（需竞品对照数据）
        flow_step: 7
        priority: P1
        check_type: requires_meta
        meta_key: ddr_freq_diff
        meta_value: true

      - id: opt_boost_lockscreen_vs_competitor
        subcategory: 提频锁屏
        label: 提频锁屏与竞品存在差异
        flow_step: 7
        priority: P1
        check_type: requires_meta
        meta_key: boost_lockscreen_diff
        meta_value: true

      - id: opt_fps_vs_competitor
        subcategory: 帧率
        label: 帧率与竞品存在差异（需游戏场景高帧认证统计表）
        flow_step: 7
        priority: P1
        check_type: requires_meta
        meta_key: fps_diff_vs_competitor
        meta_value: true

  feature_difference:
    order: 4
    title: 功能差异
    patterns:
      - id: feat_game_assistant
        label: 游戏助手
        priority: P2
        check_type: evidence_keyword
        keywords: [GameAssistant, game_assistant, 游戏助手, com.transsion.gameassistant, SmartPanel]

      - id: feat_dynamic_island
        label: 灵动岛
        priority: P2
        check_type: evidence_keyword
        keywords: [DynamicIsland, dynamic_island, 灵动岛, IslandNotification]

      - id: feat_backlight_effect
        label: 背光灯效
        priority: P2
        check_type: evidence_keyword
        keywords: [AuraLight, aura_light, 背光灯, LightEffect, RGB]

      - id: feat_elevator_mode
        label: 电梯模式
        priority: P2
        check_type: evidence_keyword
        keywords: [elevator_detect, elevator, 电梯模式, TceSensorManager]

      - id: feat_game_ai
        label: 游戏AI
        priority: P2
        check_type: evidence_keyword
        keywords: [GameAI, game_ai, 游戏AI, AIHelper]

      - id: feat_immersive_audio
        label: 沉浸音效
        priority: P2
        check_type: evidence_keyword
        keywords: [ImmersiveAudio, immersive, 沉浸音效, SpatialAudio]

      - id: feat_screen_record
        label: 录屏投屏
        priority: P2
        check_type: evidence_keyword
        keywords: [ScreenRecord, screenrecord, MediaProjection, 投屏, Mirror, Cast]

  abnormal_situation:
    order: 5
    title: 异常问题
    patterns:
      # —— 步骤8 异常进程 ——
      - id: abn_cpu_over_10_not_game
        subcategory: 异常进程
        label: 异常进程CPU使用率占比超10%，且不在游戏场景表中
        flow_step: 8
        priority: P0
        source: game_kernel_cpu
        path: abnormal_processes
        op: count_gte
        value: 1

      - id: abn_process_over_baseline_20
        subcategory: 异常进程
        label: 标准进程/游戏进程CPU占比超出参考数据20%，或提升了20%
        flow_step: 8
        priority: P1
        check_type: requires_meta
        meta_key: process_cpu_over_baseline_20
        meta_value: true

      - id: abn_process_volatile
        subcategory: 异常进程
        label: 使用率统计中波动较大的进程
        flow_step: 8
        priority: P1
        check_type: requires_meta
        meta_key: volatile_process_detected
        meta_value: true

      - id: abn_background_process
        subcategory: 异常进程
        label: 后台异常进程（聚合）
        flow_step: 8
        priority: P0
        source: game_kernel_cpu
        path: abnormal_processes
        op: count_gte
        value_ref: abnormal_process_count

      # —— 步骤9 后台应用 ——
      - id: abn_autostart_too_many
        subcategory: 后台应用
        label: 自启动/重启服务应用超过5个或单个时长占比超过30s
        flow_step: 9
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_background
            path: background_investigation.step1_process_autostart.frequent_autostart
            op: eq
            value: true
          - source: game_background
            path: background_investigation.step1_process_autostart.frequent_autostart_packages
            op: count_gte
            value_ref: background_autostart_packages
          - source: game_background
            path: background_investigation.step1_process_autostart.total_service_restarts
            op: gte
            value_ref: background_autostart_packages
          - source: game_background
            path: autostart.max_duration_seconds
            op: gte
            value_ref: background_single_duration_seconds

      - id: abn_memory_over_10
        subcategory: 后台应用
        label: 后台应用内存占用对比标准数据超出10%
        flow_step: 9
        priority: P1
        check_type: requires_meta
        meta_key: memory_over_baseline_10
        meta_value: true

      - id: abn_gc_storm
        subcategory: 后台应用
        label: 存在GC风暴
        flow_step: 9
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_background
            path: background_investigation.step4_gc_storm.gc_storm
            op: eq
            value: true
          - source: game_background
            path: category_breakdown_T_game.gc
            op: gte
            value_ref: gc_storm_count

      - id: abn_process_restart
        subcategory: 后台应用
        label: 进程频繁拉起/重启
        flow_step: 9
        priority: P1
        source: game_background
        path: category_breakdown_T_game.process_start
        op: gte
        value: 10

      - id: abn_broadcast_storm
        subcategory: 后台应用
        label: 广播风暴
        flow_step: 9
        priority: P1
        source: game_background
        path: category_breakdown_T_game.broadcast
        op: gte
        value_ref: broadcast_storm_count

      - id: abn_alarm_storm
        subcategory: 后台应用
        label: alarm/job风暴
        flow_step: 9
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_background
            path: category_breakdown_T_game.alarm
            op: gte
            value_ref: alarm_storm_count
          - source: game_background
            path: category_breakdown_T_game.job
            op: gte
            value_ref: alarm_storm_count

      # —— 步骤10 网络 ——
      - id: abn_wifi_weak_or_volatile
        subcategory: 网络
        label: WiFi/数据网信号强度差于标准或波动较大（WiFi<-90；数据RSRP<-110）
        flow_step: 10
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_network
            path: rf_stats.level
            op: in
            value: [weak, suspect]
          - source: game_network
            path: wifi_rssi.T_game.avg_dbm
            op: lt
            value_ref: wifi_weak_rssi_dbm
          - source: game_network
            path: cellular_signal.T_game.rsrp_avg_dbm
            op: lt
            value_ref: cellular_weak_rsrp_dbm
          - source: game_network
            path: network_investigation.step1_wifi_signal.weak
            op: eq
            value: true
          - source: game_network
            path: network_investigation.step3_cellular_signal.weak
            op: eq
            value: true

      - id: abn_wifi_data_coexist
        subcategory: 网络
        label: WiFi频繁切换且出现WiFi和数据共存
        flow_step: 10
        priority: P1
        check_type: composite
        op: or
        conditions:
          - source: game_network
            path: scene_switch.wifi_mobile_coexist
            op: eq
            value: true
          - source: game_network
            path: network_investigation.step2_scene_switch.wifi_mobile_coexist
            op: eq
            value: true
          - check_type: composite
            op: and
            conditions:
              - source: game_network
                path: scene_switch.wifi_changes
                op: gte
                value: 3
              - source: game_network
                path: scene_switch.mobile_active
                op: eq
                value: true

      - id: abn_cell_band_diff
        subcategory: 网络
        label: 数据网驻网频段差异（需对比不同驻网频段功耗）
