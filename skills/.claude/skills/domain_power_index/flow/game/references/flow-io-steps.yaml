# flow/game 步骤 1～14 输入 / 输出说明书
# 路径约定：
#   log_path 默认 flow/game/mobilelog/<APLog_*>
#   analysis_dir = <log_path>/analysis
# 关联入口：../SKILL.md 、scripts/run_game_flow.py

meta:
  name: flow_power_game_io
  version: "1.0"
  description: MTK 游戏场景功耗 flow 各步骤输入输出对照
  log_path_default: "flow/game/mobilelog/<APLog_*>"
  analysis_dir: "<log_path>/analysis"
  shared_meta_file: "<analysis_dir>/game_analysis_meta.json"

common_inputs:
  log_path:
    required: false
    default: "flow/game/mobilelog/<APLog_*>"
    description: APLog / mobilelog 根目录
  window_json:
    required: false
    default: "<analysis_dir>/game_time_window.json"
    description: 游戏时段 T_game；步骤 4、6～11 默认读取
  game_package:
    required: false
    description: 游戏包名；可从 window_json 继承
  project:
    required: false
    description: 飞书亮度和音量表中的项目名，如 项目1
  test_case:
    required: false
    default: basic
    enum: [basic, nps]
    description: 基础场景 / NPS
  jira_key:
    required: false
    description: JIRA 单号；可解析项目与测试场景
  debug_log:
    required: false
    description: 调试开关，写入 flow/game/game_test.log

steps:
  - step: 1
    id: log_check
    name: 日志检查
    skill: flow_power_game（门禁 + discover_logs）
    skill_path: ./SKILL.md
    depends_on: []
    description: >
      扫描日志目录，确认 mobile 核心日志与 bugreport 是否齐全，
      作为后续分析门禁与「日志不全/无日志」判断依据。
    inputs:
      required:
        - name: log_path
          type: directory
          description: APLog / mobilelog 目录
      optional: []
    reads_logs:
      - events_log
      - main_log
      - sys_log
      - kernel_log
      - radio_log
      - bugreport
      - ged_fps_log（可选）
      - spm_log / thermal_log / pmic_log / dramc_log / wifilog（可选）
    outputs:
      primary:
        - name: log_inventory
          type: object
          description: >
            mobile_core_missing / bugreport / incomplete / no_logs /
            scene_coverage_missing / missing_for_report
          written_by: discover_logs + build_log_inventory
        - name: log_availability
          type: object
          description: 各日志类型 ok|missing 映射
      files: []
      notes:
        - 本步通常不单独落盘；结果写入后续 game_time_window.json / game_power_compare_summary.json 的 log_inventory 字段

  - step: 2
    id: kernel_time_convert
    name: kernel 时间转换
    skill: mtk_kernellog_convert
    skill_path: ../../../base/mtk_kernellog_convert/SKILL.md
    depends_on: [1]
    description: 将 kernel 相对时间转为带时区的绝对时间，供后续 [K] 统计对齐。
    inputs:
      required:
        - name: log_path
          type: directory
          description: 含 kernel_log / events_log 的目录
      optional: []
    reads_logs:
      - kernel_log
      - events_log（用于电量事件对齐推算时区差）
    outputs:
      primary:
        - name: kernel_linli
          type: file
          path: "<log_path>/kernel_log_*_linli_666.txt"
          description: 绝对时间 kernel 日志
      files:
        - "<log_path>/*_linli_666.txt"
      notes:
        - 优先供步骤 3/8/11 等读取

  - step: 3
    id: game_time_window
    name: 场景识别
    skill: game_time_window
    skill_path: ./game_time_window/SKILL.md
    depends_on: [2]
    description: 识别游戏前台时段 T_game，并检查核心日志是否覆盖该时段。
    inputs:
      required:
        - name: log_path
          type: directory
      optional:
        - name: game_package
          type: string
        - name: start / end
          type: datetime
          description: 手动指定游戏起止；缺省从 event 推断
        - name: output
          type: path
          default: "<analysis_dir>/game_time_window.json"
    reads_logs:
      - events_log（主）
      - kernel_log / main_log / sys_log / radio_log（覆盖检查）
    outputs:
      primary:
        - name: game_time_window.json
          path: "<analysis_dir>/game_time_window.json"
          key_fields:
            - status
            - game_name / game_package
            - game_window.{start,end,duration_seconds}
            - time_windows.{T_pre,T_game,T_post}
            - phases.{startup,stable,exit}
            - log_coverage
            - log_inventory
      notes:
        - status=failed|need_confirm → 澄清报告「日志无场景」
        - log_inventory.scene_coverage_missing → 「场景日志不全」

  - step: 4
    id: game_precondition
    name: 前置条件检查
    skill: game_precondition
    skill_path: ./game_precondition/SKILL.md
    depends_on: [2, 3]
    description: >
      按项目×用例查亮度和音量表，核对测试亮度/音量是否合规；
      解析并落盘项目上下文。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: project
          type: string
          description: 如 项目1；路径模式未指定时交互选择
        - name: test_case
          type: string
          enum: [basic, nps]
        - name: jira_key
          type: string
        - name: game_package
          type: string
        - name: pre_minutes
          type: int
          default: 5
        - name: output
          type: path
          default: "<analysis_dir>/game_precondition.json"
    reads_logs:
      - main_log（BrightnessCollector / TranAuraController）
      - sys_log（NPS：DisplayPowerController nits）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
      - "game_precondition/references/brightness-volume-by-project.yaml"
      - "game_precondition/references/test-condition-standards.yaml"
    outputs:
      primary:
        - name: game_precondition.json
          path: "<analysis_dir>/game_precondition.json"
          key_fields:
            - status
            - test_conditions.tags（brightness/volume 等）
            - test_conditions.brightness_volume_setting
            - test_conditions.scenario
            - project_context
        - name: game_analysis_meta.json
          path: "<analysis_dir>/game_analysis_meta.json"
          description: project / test_case / volume_index / brightness_level 等，供步骤 6/14 复用
      notes:
        - basic：比对 brightness_level / volume_index
        - nps：比对 brightness_nits / 最大音量档

  - step: 5
    id: game_power_model
    name: 功耗拆解模型
    skill: game_power_model
    skill_path: ./game_power_model/SKILL.md
    depends_on: []
    description: >
      输出功耗拆解公式与归因框架；每次跑 flow 对比飞书与本地缓存中
      测试机/对比机条目，有差异则仅增量更新这两台到 JSON，并生成 known_deltas。
    inputs:
      required: []
      optional:
        - name: project / version / config / test_case
          type: string
          description: 飞书台账匹配维度（「项目」列常为机型代号）
        - name: test_device / compare_device
          type: string
          description: 机型标签（如 CN6 / X6878）；同步与匹配均仅针对这些机型
        - name: feishu_url / offline_only
          type: string|bool
        - name: output
          type: path
          default: "<analysis_dir>/game_power_model.json"
    reads_logs: []
    reads_files:
      - "game_power_model/references/hardware-power-source.yaml"
      - "game_power_model/references/hardware-power-by-project.json（缓存；按机型增量更新）"
      - "飞书 Wiki 多维表 / 电子表格"
    outputs:
      primary:
        - name: game_power_model.json
          path: "<analysis_dir>/game_power_model.json"
          key_fields:
            - power_model（P_total = P_AP + P_Display + P_Audio + P_RF + P_Others）
            - 子系统 ↔ 步骤 6～11 映射
            - 问题归因分类框架（测试手法不符 / 器件差异 / 软件策略差异 / 功能差异 / 异常问题）
            - hardware_power.{source,sync,test,compare,known_deltas}
      notes:
        - 步骤 14 自动灌入器件差异 known_deltas；环境差异须先用步骤 4 排除
        - sync.changed/updated 反映飞书 vs 缓存差分；其它机型缓存不动

  - step: 6
    id: game_brightness
    name: 显示 / 亮度
    skill: game_brightness
    skill_path: ./game_brightness/SKILL.md
    depends_on: [2, 3, 4]
    description: 六步排查测试亮度、自动背光、背光2.0、AAL、温控降亮、刷新率。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: project / test_case / jira_key
          type: string
          description: 可从 game_analysis_meta.json 继承
        - name: game_package
          type: string
        - name: max_brightness_scenario
          type: flag
        - name: pre_minutes / post_minutes / entry_seconds / launch_seconds
          type: int
        - name: output
          type: path
          default: "<analysis_dir>/game_brightness.json"
    reads_logs:
      - main_log
      - sys_log
      - kernel_log（可选）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
      - "<analysis_dir>/game_analysis_meta.json"
    outputs:
      primary:
        - name: game_brightness.json
          path: "<analysis_dir>/game_brightness.json"
          key_fields:
            - brightness_investigation.step1_test_setting ～ step6_refresh_rate
            - step4_aal_strategy.effective / last_bl / stable_bl（main 搜 AALService）
            - pre_test_brightness / brightness_analysis / refresh_rate
      notes:
        - 步骤 14 可生成 game_brightness_report.html 摘要
        - AAL：main log 有 AALService 即生效；代表亮度取末次或间隔≥2s 稳定值

  - step: 7
    id: game_volume
    name: 音量
    skill: game_volume
    skill_path: ./game_volume/SKILL.md
    depends_on: [3]
    description: 从 TranAuraController 读取测试前音量档，并检查游戏内是否变音量。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: game_package
          type: string
        - name: output
          type: path
          default: "<analysis_dir>/game_volume.json"
    reads_logs:
      - main_log（TranAuraController）
      - events_log / sys_log（辅助）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
    outputs:
      primary:
        - name: game_volume.json
          path: "<analysis_dir>/game_volume.json"
          key_fields:
            - volume_investigation.step1_test_setting
            - volume_investigation.step2_in_game_changes
            - pre_test_volume / in_game_volume
      notes:
        - 与步骤 4 音量目标档对照，用于「音量未设置正确」

  - step: 8
    id: game_cpu_gpu_ddr
    name: CPU / GPU / DDR
    skill: game_cpu_gpu_ddr
    skill_path: ./game_cpu_gpu_ddr/SKILL.md
    depends_on: [2, 3]
    description: 五步排查滑动提频、DDR、trace、帧率、thermal 限频；可联动 kernel [K]/game_trace。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: game_package
          type: string
        - name: perf_html
          type: path
          description: MTK perf-statistic.html（步骤 3 子能力 game_trace 推荐）
        - name: trace_path
          type: path
        - name: soc_model
          type: string
          description: 能效表查 OPP 用，如 CN6
        - name: output
          type: path
          default: "<analysis_dir>/game_cpu_gpu_ddr.json"
    reads_logs:
      - main_log
      - kernel_log（[K] / game_kernel_cpu）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
      - "perf-statistic.html / trace（可选）"
    outputs:
      primary:
        - name: game_cpu_gpu_ddr.json
          path: "<analysis_dir>/game_cpu_gpu_ddr.json"
          key_fields:
            - cpu_gpu_ddr_investigation.step1_touch_boost ～ step5_thermal_throttle
            - 帧率 / perfLock / DDR opp 等
        - name: game_kernel_cpu.json（子模块，可选单独跑）
          path: "<analysis_dir>/game_kernel_cpu.json"
        - name: game_trace.json（有 perf-html 时）
          path: "<analysis_dir>/game_trace.json"
      notes:
        - 步骤 6～11 可并行

  - step: 9
    id: game_background
    name: 后台应用
    skill: game_background
    skill_path: ./game_background/SKILL.md
    depends_on: [3]
    description: 四步排查自启动/内存/后台下载/GC 风暴。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: game_package
          type: string
        - name: output
          type: path
          default: "<analysis_dir>/game_background.json"
    reads_logs:
      - events_log（am_proc_start / am_pss 等）
      - main_log（Download / GCloud / GC）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
    outputs:
      primary:
        - name: game_background.json
          path: "<analysis_dir>/game_background.json"
          key_fields:
            - background_investigation.step1_process_autostart ～ step4_gc_storm
            - top_background_packages / category_breakdown_T_game
      notes:
        - game_download ≥ 1 → 「后台下载未关闭」

  - step: 10
    id: game_network
    name: 网络连接
    skill: game_network
    skill_path: ./game_network/SKILL.md
    depends_on: [3]
    description: 四步排查 WiFi 信号、场景切换、蜂窝信号、数传，并做 RF 聚合。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: game_package
          type: string
        - name: output
          type: path
          default: "<analysis_dir>/game_network.json"
    reads_logs:
      - main_log（WiFi RSSI）
      - radio_log（场景切换 / 蜂窝）
      - kernel_log（ccmni 数传）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
    outputs:
      primary:
        - name: game_network.json
          path: "<analysis_dir>/game_network.json"
          key_fields:
            - network_investigation.step1 ～ step4
            - rf_stats / scene_switch / wifi_rssi / cellular_signal
      notes:
        - scene_switch 大幅变化 → 「网络环境变化差异较大」

  - step: 10b
    id: game_network_cap
    name: 抓包功耗影响
    skill: game_network_cap
    skill_path: ./game_network_cap/SKILL.md
    depends_on: [3, 10]
    description: >
      条件步骤：存在 networklog 且有与 T_game 重叠的 .cap 时解析抓包，
      提炼双通道/高吞吐等功耗因子；否则 skipped。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: force
          type: bool
          description: 跳过门禁强制解析
        - name: device_label
          type: string
          description: 额外写入 workspace analysis/game_network_cap_<label>.json
        - name: output
          type: path
          default: "<analysis_dir>/game_network_cap.json"
    reads_logs: []
    reads_files:
      - "<analysis_dir>/game_time_window.json"
      - "设备包 networklog/netlog/NTLog_*/tcpdump_*.cap"
    outputs:
      primary:
        - name: game_network_cap.json
          path: "<analysis_dir>/game_network_cap.json"
          key_fields:
            - gate.should_run / status
            - dual_channel
            - power_impact.{has_impact,level,factors,report_rows,summary}
      notes:
        - 澄清报告在网络/RF 后追加「抓包功耗影响」
        - 依赖主机 Wireshark CLI（capinfos/tshark）

  - step: 11
    id: game_thermal
    name: Thermal 温控
    skill: game_thermal
    skill_path: ./game_thermal/SKILL.md
    depends_on: [3]
    description: 两步排查 thermal 信息与 CPU 介入；聚合温升、降背光、限频。
    inputs:
      required:
        - name: log_path
          type: directory
        - name: window_json 或 start/end
          type: path|datetime
      optional:
        - name: game_package
          type: string
        - name: output
          type: path
          default: "<analysis_dir>/game_thermal.json"
    reads_logs:
      - main_log（tran_thermal_engine / ThermalEngineTypeData）
      - sys_log（可选）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
    outputs:
      primary:
        - name: game_thermal.json
          path: "<analysis_dir>/game_thermal.json"
          key_fields:
            - thermal_investigation.step1_thermal_info / step2_cpu_intervention
            - thermal_report.backlight_dim / freq_throttle / temp_timeline
            - thermal_summary.during_game / temperature.T_game
      notes:
        - 澄清报告拆成 thermal降亮度 / thermal限频两句 + 分档 + T_game 温度曲线
        - 仅 gameMode=1 不算降亮/限频生效

  - step: 12
    id: game_summary
    name: 数据汇总
    skill: game_summary
    skill_path: ./game_summary/SKILL.md
    depends_on: [3, 4, 5, 6, 7, 8, 9, 10, 10b, 11]
    description: 合并步骤 3～11 证据，生成对比汇总 JSON 与数据看板 HTML。
    inputs:
      required:
        - name: log_path
          type: directory
      optional:
        - name: output_dir
          type: path
          default: "<analysis_dir>"
        - name: game_package
          type: string
    reads_logs:
      - 可再次扫描日志做全量 parser（建议已有步骤 2～11 产物）
    reads_files:
      - "<analysis_dir>/game_time_window.json"
      - "<analysis_dir>/game_precondition.json"
      - "<analysis_dir>/game_brightness.json"
      - "<analysis_dir>/game_volume.json"
      - "<analysis_dir>/game_cpu_gpu_ddr.json"
      - "<analysis_dir>/game_background.json"
      - "<analysis_dir>/game_network.json"
      - "<analysis_dir>/game_network_cap.json"
      - "<analysis_dir>/game_thermal.json"
      - "<analysis_dir>/game_power_model.json"
    outputs:
      primary:
        - name: game_power_compare_summary.json
          path: "<analysis_dir>/game_power_compare_summary.json"
          key_fields:
            - status / missing_logs / log_availability / log_inventory
            - game_window / time_windows / test_conditions
            - comparison_outputs / top_background_packages / abnormal_processes
        - name: game_power_report.html
          path: "<analysis_dir>/game_power_report.html"
          description: 数据汇总仪表板
        - name: game_power_timeseries.jsonl
          path: "<analysis_dir>/game_power_timeseries.jsonl"
          description: 可选时序采样
      notes:
        - 步骤 13/14 的主输入之一

  - step: 13
    id: game_current_log_correlate
    name: 电流 ↔ 日志关联
    skill: game_current_log_correlate
    skill_path: ./game_current_log_correlate/SKILL.md
    depends_on: [12]
    description: >
      用 pt5/电流曲线找抬高窗，对齐到日志分维归因。
      无 pt5 时 status=skipped，不阻断流程。
    inputs:
      required:
        - name: log_path
          type: directory
      optional:
        - name: pt5
          type: path
          description: .pt5 / .csv / .json 电流文件
        - name: pt5_dir
          type: path
          description: 电流文件搜索目录
        - name: jira_key
          type: string
          description: 旁路按单号找附件
        - name: threshold_ma
          type: float
          default: 20
        - name: window_sec / step_sec / top_n / pt5_offset_sec
          type: number
    reads_files:
      - "<analysis_dir>/game_power_compare_summary.json"
      - "<analysis_dir>/game_kernel_cpu.json（或 cpu 相关）"
      - "<analysis_dir>/game_brightness.json"
      - "<analysis_dir>/game_background.json"
      - "<analysis_dir>/game_network.json"
      - "<analysis_dir>/game_thermal.json"
      - pt5 电流文件
    outputs:
      primary:
        - name: game_current_log_correlate.json
          path: "<analysis_dir>/game_current_log_correlate.json"
          key_fields:
            - status（ok|skipped）
            - raised_windows[]
            - waveform_analysis（供步骤 14 确认功耗差）
        - name: game_current_log_correlate_report.html
          path: "<analysis_dir>/game_current_log_correlate_report.html"
      notes:
        - 无 pt5 → skipped，步骤 14 仍可继续

  - step: 13b
    id: game_current_cpu_spike
    name: 电流图对比（异常问题）
    skill: dou_2.current_cpu_spike
    skill_path: ../dou_2/tool1_2/run_current_cpu_spike.py
    wrapper: ./scripts/run_game_current_cpu_spike.py
    depends_on: [12]
    description: >
      接入 DOU current_cpu_spike：双机 pt5 对齐对比底电/差异窗口；
      结果写入澄清报告「异常问题」第 1 项；无两份 pt5 时 status=skipped，不阻断。
    inputs:
      required:
        - name: log_path
          type: directory
      optional:
        - name: pt5
          type: path
          description: 测试机（高功耗）电流图
        - name: pt5_compare
          type: path
          description: 对比机（低功耗）电流图
        - name: pt5_dir
          type: path
          description: 目录内自动搜索；≥2 个则对比
        - name: jira_key
          type: string
        - name: duration_sec / window_sec / step_sec / top_windows
          type: number
    reads_files:
      - pt5 电流文件（需两份）
      - "<analysis_dir>/game_time_window.json"（可选，取时长）
    outputs:
      primary:
        - name: game_current_cpu_spike.json
          path: "<analysis_dir>/game_current_cpu_spike.json"
          key_fields:
            - status（ok|skipped|error）
            - report_html（嵌入澄清报告「异常问题」第 1 项）
            - spike（DOU current_cpu_spike 原文）
        - name: current_cpu_spike_game.json
          path: "<analysis_dir>/current_cpu_spike_game.json"
          description: DOU 引擎原始产物
      notes:
        - 仅一份 pt5 → skipped（DOU 工具要求高低双端）

  - step: 14
    id: game_diagnosis_report
    name: 诊断 → 澄清报告
    skill: game_diagnosis_report
    skill_path: ./game_diagnosis_report/SKILL.md
    depends_on: [12]
    optional_depends_on: [13, 13b]
    description: >
      确认问题单功耗差 I1、排除已知器件差并分流；
      规则引擎归因判断（测试手法不符 / 软件策略差异 / 功能差异 / 异常问题）+ AI 建议；
      合并写入唯一澄清报告 HTML。
    inputs:
      required:
        - name: log_path
          type: directory
      optional:
        - name: meta_json
          type: path
          description: 问题单元数据 JSON
        - name: jira_key / device_model / game_title / issue_url / priority
          type: string
        - name: test_power_ma / competitor_power_ma / delta_power_ma
          type: float
          description: 测试机 / 对比机 / 差值 I1（mA）
        - name: screen_delta_ma / speaker_delta_ma / cpu_delta_ma / rf_delta_ma
          type: float
          description: 已知器件差（mA）
        - name: adjusted_delta_ma
          type: float
          description: 去掉已知差后的残留
        - name: expected_network
          type: string
          enum: [wifi, data]
        - name: ai_json
          type: path
          description: 外部 LLM 判断结果
        - name: project / test_case
          type: string
          description: 可从 game_analysis_meta.json 继承，用于报告亮度/音量「要求」列
    reads_files:
      - "<analysis_dir>/game_power_compare_summary.json"
      - "<analysis_dir>/game_*.json"（步骤 3～13b 各维）
      - "<analysis_dir>/game_analysis_meta.json"
      - "<analysis_dir>/game_current_log_correlate.json"（可选）
      - "<analysis_dir>/game_current_cpu_spike.json"（可选）
      - "game_root_cause/references/cause-judgment-rules.yaml"
      - "game_root_cause/references/cause-attribution-mapping.yaml"
      - "game_root_cause/references/report-defaults.yaml"
    outputs:
      primary:
        - name: game_power_delta.json
          path: "<analysis_dir>/game_power_delta.json"
          description: I1 / 已知差合计 / 分流 routing
        - name: game_preliminary_diagnosis.json
          path: "<analysis_dir>/game_preliminary_diagnosis.json"
        - name: game_ai_insights.json
          path: "<analysis_dir>/game_ai_insights.json"
        - name: game_root_cause.json
          path: "<analysis_dir>/game_root_cause.json"
          description: 归因命中明细（复用 game_root_cause）
        - name: game_diagnosis_report.json
          path: "<analysis_dir>/game_diagnosis_report.json"
          description: 编排摘要
        - name: game_power_clarify_report.html
          path: "<analysis_dir>/game_power_clarify_report.html"
          description: >
            唯一总澄清报告：测试条件、功耗 KPI、器件拆解表、
            原因分析（测试手法不符表 / 软件策略 / 功能 / 异常问题）、AI 建议、子报告链接
        - name: 分维摘要 HTML
          paths:
            - "<analysis_dir>/game_brightness_report.html"
            - "<analysis_dir>/game_volume_report.html"
            - "<analysis_dir>/game_thermal_report.html"
            - "<analysis_dir>/game_cpu_gpu_ddr_report.html"
            - "<analysis_dir>/game_kernel_cpu_report.html"
            - "<analysis_dir>/game_background_report.html"
            - "<analysis_dir>/game_network_report.html"
            - "等（由 JSON 生成；汇总仪表板沿用 game_power_report.html）"
      notes:
        - 不再单独输出 game_diagnosis_report.html
        - I ≥ I1 → known_delta_module；I < I1 → continue_analysis

# 数据依赖简图（谁读谁）
data_flow:
  - "log_path → 1 discover_logs → log_inventory"
  - "log_path → 2 linli_666"
  - "2 + events → 3 game_time_window.json"
  - "3 + project → 4 game_precondition.json + game_analysis_meta.json"
  - "（无日志）→ 5 game_power_model.json"
  - "3 (+4 meta) → 6..11 各 game_*.json（可并行）"
  - "3..11 → 12 game_power_compare_summary.json + game_power_report.html"
  - "12 + pt5? → 13 game_current_log_correlate.json"
  - "12 + 双 pt5? → 13b game_current_cpu_spike.json（DOU current_cpu_spike）"
  - "12 + 13/13b? + 问题单功耗 → 14 game_power_clarify_report.html"

# 辅助 skill（非独立主步骤，但可被调用）
helpers:
  - id: game_root_cause
    used_by_step: 14
    path: ./game_root_cause/SKILL.md
    input: analysis 目录各 JSON + meta
    output: game_root_cause.json + 澄清报告原因段
  - id: game_kernel_cpu
    used_by_step: 8
    path: ./game_kernel_cpu/SKILL.md
    input: log_path + window_json
    output: game_kernel_cpu.json
  - id: game_trace
    used_by_step: 8
    path: ./game_trace/SKILL.md
    input: perf-statistic.html / trace + 可选 soc_model
    output: game_trace.json
  - id: game_project_resolve
    used_by_step: [4, 6, 14]
    path: ./game_precondition/scripts/game_project_resolve.py
    input: CLI project / jira_key / 交互选择
    output: game_analysis_meta.json
