# 游戏场景网络四步排查关键词

version: 1

primary_logs: [main_log, radio_log, kernel_log]

investigation:
  description: 四步网络排查（T_game）
  patterns:
    - id: step1_wifi_rssi
      status: active
      logs: [main_log]
      keywords:
        - TranWifiSmartAssistantController
        - ====>>rssi
        - rssi
        - stop monitor
        - top app
        - white list
        - Landscape screen
        - mCurrentNetwork
        - SSID
        - userIgnored
        - isScoredCurrentNetwork
        - mNoCandidateCount
        - start current network monitor
      category: wifi_rssi
    - id: step2_wifi_scenario
      status: active
      logs: [radio_log, main_log, sys_log]
      keywords: [NetworkStatusMonitor, updateInterfaceNameMap]
      category: wifi_scenario
    - id: dual_channel
      status: active
      logs: [radio_log, main_log, kernel_log]
      keywords: [NetworkStatusMonitor, mobile, wifi, ccmni, TranWifiSmartAssistantController]
      category: dual_channel
    - id: step3_cellular_signal
      status: active
      logs: [radio_log]
      keywords: [RmmNwHdlr, rsrp, rsrq, sinr, band]
      category: cellular_signal
    - id: step4_ccmni_transfer
      status: active
      logs: [kernel_log]
      keywords: [ccmni]
      category: data_transfer
