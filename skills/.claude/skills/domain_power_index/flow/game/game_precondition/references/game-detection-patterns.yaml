# 游戏场景额外探测项（合并到 detection-patterns 使用）

game_patterns:
  refresh_rate:
    label_zh: 刷新率
    patterns:
      - regex: 'updateFrameRateVote \[.*?refreshRate = ([\d.]+)'
        strategy: last_group
        group: 1
        kind: refresh_hz
        package_scoped: true
      - regex: 'renderFrameRate ([\d.]+)'
        strategy: last_group
        group: 1
        kind: refresh_hz
      - regex: 'RefreshRateSelector: Current:.*?render=\[([\d.]+) Hz'
        strategy: last_group
        group: 1
        kind: refresh_hz
  gesture_nav:
    label_zh: 手势导航
    patterns:
      - regex: 'TrEdgeBackGestureHandler'
        strategy: presence
        presence_game: ON
      - regex: 'navigation_mode.*?gestural'
        strategy: presence
        presence_game: ON
  logger:
    label_zh: Logger
    patterns:
      - regex: 'com\.debug\.loggerui'
        strategy: presence
        presence_game: ON
      - regex: '\bemdlogger\b'
        strategy: presence
        presence_game: ON
      - regex: 'MobileLogD'
        strategy: presence
        presence_game: ON
    default_when_absent: OFF
