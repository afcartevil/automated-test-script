# 游戏前置条件日志探测（flow/game/game_precondition）

version: 1

items:
  airplane:
    label_zh: 飞行模式
    patterns:
      - regex: 'mIsAirplaneMode=(true|false)'
        flags: ignorecase
        strategy: last_group
        group: 1
        map_true_game: ON
        map_false_game: OFF
      - regex: '\[persist\.radio\.airplane_mode_on\]:\s*\[(0|1)\]'
        strategy: last_group
        group: 1
        map_1_game: ON
        map_0_game: OFF

  data:
    label_zh: 数据流量
    patterns:
      - regex: 'TranMccSar: updateStateForDataConnectionChanged: (true|false)'
        strategy: last_group
        group: 1
        map_true_game: ON
        map_false_game: OFF

  wifi:
    label_zh: WIFI
    patterns:
      - regex: 'WifiController: EnabledState\.enter\(\)'
        strategy: event
        event_game: wifi_on
      - regex: 'WifiController: DisabledState\.exit\(\)'
        strategy: event
        event_game: wifi_off
      - regex: 'netstats_wifi_sample:'
        strategy: event
        event_game: wifi_on
    resolve: last_event
    game_event_wifi_on: ON
    game_event_wifi_off: OFF

  bt:
    label_zh: 蓝牙
    patterns:
      - regex: 'BluetoothAdapter: isLeEnabled\(\):\s*(ON|OFF)'
        flags: ignorecase
        strategy: last_group
        group: 1
        map_ON_game: ON
        map_OFF_game: OFF
      - regex: 'BluetoothManagerService: Persisting Bluetooth Setting: (0|1)'
        strategy: last_group
        group: 1
        map_1_game: ON
        map_0_game: OFF
      - regex: 'BluetoothSystemServer: BluetoothManagerService: Persisting Bluetooth Setting: (0|1)'
        strategy: last_group
        group: 1
        map_1_game: ON
        map_0_game: OFF
      - regex: 'adapter state changed: (10|12|13)'
        strategy: last_group
        group: 1
        map_10_game: OFF
        map_12_game: ON
        map_13_game: ON

  gps:
    label_zh: GPS
    patterns:
      - regex: 'GpsNetInitiatedHandler: location enabled :(true|false)'
        strategy: last_group
        group: 1
        map_true_game: ON
        map_false_game: OFF

  nfc:
    label_zh: NFC
    patterns:
      - regex: 'TranNfcAllowCardReadController:\s+setPreferenceEnabled\s+isEnabled = (true|false)'
        strategy: last_group
        group: 1
        map_true_game: ON
        map_false_game: OFF

  sim:
    label_zh: SIM卡
    patterns:
      - regex: 'FIND_SimStateReceiver: SIM inserted'
        strategy: event
        event_game: 已插入
      - regex: 'FIND_SimStateReceiver: SIM unplugged'
        strategy: event
        event_game: 未插入
    resolve: last_event

  auto_rotate:
    label_zh: 自动旋转屏幕
    patterns:
      - regex: 'Tile\.TrRotationLockTile: click rotation, current mState\.value=(true|false)'
        strategy: last_group
        group: 1
        map_true_game: OFF
        map_false_game: ON

  auto_brightness:
    label_zh: 自动背光
    resolve: timeline_last
    on_value: ON
    off_value: OFF
    controller_marker: com.android.server.display.AutomaticBrightnessController
    game_event_auto_brightness_on: ON
    game_event_auto_brightness_off: OFF
    patterns:
      - id: sensor_auto_brightness_enable
        logs: [main_log, sys_log]
        keywords: [SensorService]
        regex: 'SensorService:\s+enable:'
        example: 'SensorService: enable: connectionUid = 1000; connectionPackage = com.android.server.display.AutomaticBrightnessController; handle = 0x00000005; activate = true'
        strategy: event
        event_game: auto_brightness_on

      - id: sensor_auto_brightness_disable
        logs: [main_log, sys_log]
        keywords: [SensorService]
        regex: 'SensorService:\s+disable:'
        example: 'SensorService: disable: connectionUid = 1000; connectionPackage = com.android.server.display.AutomaticBrightnessController; handle = 0x00000005; activate = false'
        strategy: event
        event_game: auto_brightness_off

      - id: kernel_mtk_drm_cwb
        logs: [kernel_log]
        keywords: [mtk_drm_cwb]
        regex: 'mtk_drm_cwb'
        strategy: presence

      - id: kernel_cwb_work_enable
        logs: [kernel_log]
        keywords: [cwb_work]
        regex: 'cwb_work_func \[tran_sensor\]cwb enable end \[(?:sucess|success)\].*?cwb_ctrl\.stat(?:ue|us) = 1.*?cwb_ctrl\.qw_flag = 0'
        example: 'cwb_work_func [tran_sensor]cwb enable end [sucess], cwb_ctrl.statue = 1, cwb_ctrl.qw_flag = 0'
        strategy: presence

  brightness:
    label_zh: 亮度等级
    patterns:
      - regex: 'TAB\.BrightnessCollector: brightness: (\d+)'
        strategy: last_group
        group: 1
        kind: numeric
      - regex: 'lcm_setbacklight.*?level[=: ](\d+)'
        flags: ignorecase
        strategy: last_group
        group: 1
        kind: numeric_lcm

  volume:
    label_zh: 音量等级
    patterns:
      - regex: 'AudioPolicyInterfaceImpl: setStreamVolumeIndex\(\), stream (\d+), index (\d+)'
        strategy: last_group
        group: 2
        kind: volume_index
