# 游戏功耗 SOP 测试前置条件标准（flow 步骤 4）
# 亮度/音量设定值见 brightness-volume-by-project.yaml（按项目×测试用例查表）
# 物理标定：350nit / 72dB（仅说明，不直接比对日志）
# 来源：https://transsioner.feishu.cn/wiki/TTAVwmmIrif4uoknp1rcqRatn2V?sheet=ede8ca
#
# 当前范围：读取并判定「测试亮度等级 + 测试音量档」。

scope:
  enabled_items: [brightness, volume]
  deferred_items: [airplane, data, wifi, bt, gps, nfc, sim, auto_rotate, auto_brightness, refresh_rate, gesture_nav, logger]

standards:
  airplane:
    label_ok: "Airplane Mode OFF"
    label_on: "Airplane Mode ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  data:
    label_ok: "Mobile Data ON"
    label_off: "Mobile Data OFF"
    standard: "ON"
    match: ["ON", "开启"]
  wifi:
    label_ok: "WiFi ON"
    label_off: "WiFi OFF"
    standard: "ON"
    match: ["ON", "开启"]
  bt:
    label_ok: "BT OFF"
    label_on: "BT ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  gps:
    label_ok: "GPS OFF"
    label_on: "GPS ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  nfc:
    label_ok: "NFC OFF"
    label_on: "NFC ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  sim:
    label_ok: "SIM Inserted"
    label_missing: "SIM Missing"
    standard: "已插入"
    match: ["已插入"]
  auto_rotate:
    label_ok: "Auto-rotate OFF"
    label_on: "Auto-rotate ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  auto_brightness:
    label_ok: "Auto-brightness OFF"
    label_on: "Auto-brightness ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
  volume:
    standard: "按项目×用例查表 volume_index"
    deferred: false
    max_index: 15
  brightness:
    standard: "按项目×用例查表：basic=brightness_level；nps=level(0-255)>曲线(0-4095)>nits"
    level_max: 255
    level_tolerance: 0
    nits_tolerance: 20
    lcm_max_level: 2047
  refresh_rate:
    standard: "Auto"
    bad_fixed_hz: [120, 144]
    ok_hz_max: 90
  gesture_nav:
    label_ok: "Gesture Navigation ON"
    standard: "ON"
    match: ["ON", "开启"]
  logger:
    label_ok: "Logger OFF"
    label_on: "Logger ON"
    standard: "OFF"
    match: ["OFF", "关闭"]
