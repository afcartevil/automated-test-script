module:
  name: power-mgmt
  display_name: "功耗管理模块"
  domain: android-power-management
  owner: "power-integration"
  team: power-integration
  version: "1.0"
  created: "2026-05-18"
  updated: "2026-05-18"

scope:
  includes:
    - component: "Power Management Framework"
      path: "frameworks/base/services/core/java/com/android/server/power/"
      description: "Android电源管理服务"
    - component: "Power HAL"
      path: "hardware/interfaces/power/"
      description: "Power HAL接口"
    - component: "Battery Service"
      path: "frameworks/base/services/core/java/com/android/server/BatteryService.java"
      description: "电池服务"
  excludes:
    - "vendor/mediatek/proprietary/"
    - "kernel/drivers/power/"
  dependencies:
    - module: kernel-driver
      type: "runtime"
      description: "功耗策略依赖内核PM驱动"
    - module: telephony
      type: "analysis"
      description: "通话功耗分析需了解RIL状态"
