build_rules:
  build_system: "Android Soong/Make"
  build_command: "source build/envsetup.sh && lunch {target} && m {module}"
  pre_build_checks:
    - command: "checkpatch.pl --no-tree {patch_file}"
      must_pass: true
      error_msg: "补丁未通过checkpatch检查，请修复编码风格问题后重新提交。"
  post_build_checks:
    - command: "grep -rn 'getDataNetworkType()' frameworks/opt/telephony/ | grep -v '@Deprecated'"
      must_find_nothing: true
      description: "不允许使用已废弃的API（未标记@Deprecated的残留调用）"

modification_rules:
  allowed_paths:
    - "frameworks/opt/telephony/"
    - "frameworks/base/telephony/"
    - "hardware/interfaces/ril/"
    - "packages/services/Telephony/"
    - "frameworks/base/telecom/"
  forbidden_paths:
    - "frameworks/base/core/"
    - "system/core/"
    - "bionic/"
    - "external/"
  style_rules:
    java:
      - "遵循Google Java Style Guide"
      - "使用4空格缩进"
      - "类名使用UpperCamelCase"
      - "方法名使用lowerCamelCase"
      - "常量使用UPPER_SNAKE_CASE"
  interface_change_rules:
    hidl_aidl: "涉及HIDL/AIDL接口变更时，必须同时更新接口定义文件(.hal/.aidl)和所有实现端"
    api_level: "不修改public API签名，如需变更必须经模块Owner审核"
    versioning: "接口变更必须递增版本号"

quality_gates:
  critical:
    - "不允许引入新的编译错误"
    - "不允许修改与目标芯片平台无关的公共代码"
    - "不允许硬编码设备型号或IMEI"
    - "不允许移除已有的错误处理逻辑"
    - "不允许修改安全相关的权限检查代码"
  warning:
    - "不允许新增unused import"
    - "不允许新增TODO/FIXME而不关联Bug ID"
    - "不允许使用已废弃的API（查看@Deprecated注解）"
