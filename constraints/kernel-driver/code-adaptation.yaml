metadata:
  module: kernel-driver
  domain: code_adaptation
  version: "1.0"
  author: "kernel-integration"
  last_updated: "2026-05-20"
  changelog:
    - version: "1.0"
      date: "2026-05-20"
      author: "kernel-integration"
      reason: "初始版本，定义内核驱动代码适配规则"

safety_red_lines:
  - "不修改 scope.excludes 中列出的任何文件"
  - "不在未验证API存在性的情况下生成代码"
  - "不硬编码密钥/Token/设备标识"
  - "涉及安全相关的Bug必须标记为Critical"
  - "所有代码修改必须在编译门禁中通过"

rules:
  build_rules:
    build_system: "Kernel Make"
    build_command: "make ARCH=arm64 {defconfig} && make -j$(nproc)"
    pre_build_checks:
      - command: "scripts/checkpatch.pl --no-tree {patch_file}"
        must_pass: true
        error_msg: "补丁未通过checkpatch检查。"
    post_build_checks:
      - command: "make dtbs_compile -j$(nproc)"
        must_pass: true
        description: "设备树编译验证"

  modification_rules:
    allowed_paths:
      - "kernel/drivers/"
      - "kernel/arch/arm64/"
      - "kernel/include/"
    forbidden_paths:
      - "kernel/drivers/gpu/"
      - "kernel/drivers/staging/"
      - "kernel/mm/"
    style_rules:
      kernel:
        - "遵循Documentation/process/coding-style.rst"
        - "必须通过checkpatch.pl（零warning）"
        - "缩进使用Tab"

quality_gates:
  critical:
    - "不允许引入编译错误"
    - "不允许修改与目标芯片平台无关的公共代码"
    - "设备树修改不能影响其他平台配置"
    - "不允许移除已有的错误处理逻辑"
  warning:
    - "不允许新增编译警告"
    - "新增Kconfig选项必须有默认值"
