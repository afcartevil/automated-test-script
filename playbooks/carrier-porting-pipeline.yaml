name: 运营商需求移植Pipeline
version: "1.0"
description: "运营商定制需求跨项目移植"
trigger: "Owner提交运营商移植需求"

steps:
  - id: load-carrier-constraints
    agent: carrier-coordinator
    action: "加载运营商移植约束文件"
    output: carrier_constraints
  - id: parse-requirements
    agent: carrier-coordinator
    action: "解析需求清单（代码路径/配置/依赖）"
    input: [carrier_constraints]
    output: requirement_map
  - id: classify-strategy
    agent: carrier-coordinator
    action: "分类: 自动(>0.85)/半自动(0.70-0.85)/人工(<0.70)"
    input: [requirement_map]
    output: porting_plan
  - id: batch-port
    parallel:
      - id: auto-port
        agent: code-adapter
        action: "自动生成运营商定制代码和配置"
        output: auto_porting
      - id: manual-list
        agent: coordinator
        action: "生成人工处理任务清单"
        output: manual_tasks
  - id: compliance-check
    agent: verifier
    action: "合规检查(编译/generic回归/定制测试/合规标准)"
    input: [auto_porting]
    output: compliance_result
  - id: generate-report
    agent: coordinator
    action: "生成运营商移植报告"
    input: [auto_porting, manual_tasks, compliance_result]
    output: porting_report
