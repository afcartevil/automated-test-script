name: 跨模块Bug分析Pipeline
version: "1.0"
description: "当Bug涉及多个子系统时自动触发的跨模块分析流水线"
trigger: "Bug描述涉及多个子系统"

steps:
  - id: parse-bug
    agent: coordinator
    action: "解析Bug描述，识别涉及的子系统"
    output: involved_modules
  - id: load-constraints
    agent: coordinator
    action: "加载所有涉及模块的约束文件"
    input: [involved_modules]
    output: loaded_constraints
  - id: parallel-analysis
    parallel:
      - id: telephony-analysis
        agent: telephony-analyzer
        condition: "telephony in involved_modules"
        skill: telephony-bug-analyzer
        output: telephony_result
      - id: kernel-analysis
        agent: kernel-analyzer
        condition: "kernel-driver in involved_modules"
        skill: kernel-panic-tracer
        output: kernel_result
      - id: power-analysis
        agent: power-analyzer
        condition: "power-mgmt in involved_modules"
        skill: power-leak-detector
        output: power_result
  - id: synthesize
    agent: coordinator
    action: "汇总各模块分析结果，判断根因归属，生成统一报告"
    input: [telephony_result, kernel_result, power_result]
    output: unified_report
  - id: record-feedback
    agent: coordinator
    action: "记录执行轨迹，供EvoSkill分析"
    input: [unified_report]
    output: feedback_record
