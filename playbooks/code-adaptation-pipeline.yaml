name: 代码适配Pipeline
version: "1.0"
description: "基于Bug分析结果执行代码适配，遵循质量门禁"
trigger: "Bug分析完成且fix_type为code_change"

steps:
  - id: load-analysis
    agent: adapter
    action: "加载Bug分析报告和对应模块约束文件"
    output: analysis_and_constraints
  - id: scope-check
    agent: adapter
    action: "确认修改文件在scope.includes范围内，不涉及scope.excludes"
    output: scope_validation
  - id: plan-modification
    agent: adapter
    action: "输出完整修改计划（文件列表/修改类型/位置/原因/风险）"
    input: [scope_validation]
    output: modification_plan
  - id: execute-modification
    agent: adapter
    action: "严格按修改计划执行代码修改"
    input: [modification_plan]
    output: changes
  - id: quality-gate
    agent: verifier
    action: "执行P0/P1/P2质量门禁检查"
    input: [changes]
    output: gate_result
  - id: record-feedback
    agent: coordinator
    action: "记录执行轨迹和门禁结果"
    input: [gate_result]
    output: feedback_record
