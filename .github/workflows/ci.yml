name: TAHP CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r tahp-mcp-server/requirements.txt
          pip install pytest pytest-asyncio

      - name: Constraint validation
        run: python scripts/validate_constraints.py constraints/ --recursive

      - name: Gate check — telephony (P0)
        run: python scripts/gate_check.py constraints/telephony/ --level P0

      - name: Gate check — kernel-driver (P0)
        run: python scripts/gate_check.py constraints/kernel-driver/ --level P0

      - name: Gate check — power-mgmt (P0)
        run: python scripts/gate_check.py constraints/power-mgmt/ --level P0

      - name: Unit tests
        run: python -m pytest tahp-mcp-server/ scripts/tests/ -v

      - name: Script tests
        run: python -m pytest scripts/tests/ -v

      - name: Eval gate (skills/constraints changed)
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA..$HEAD_SHA" || true)
          if echo "$CHANGED" | grep -E '^constraints/|^skills/' >/dev/null; then
            echo "Eval gate: triggered by constraints/skills changes"
            python scripts/evaluate.py skills/.claude/skills/telephony-bug-analyzer/ constraints/telephony/eval-data/ --output reports/eval-report.json || echo "WARNING: Eval requires LLM API key configured"
          else
            echo "Eval gate: no relevant changes, skipping"
          fi

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: reports/quality-metrics/
          retention-days: 14
