name: TAHP CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tahp-console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tahp-console/package-lock.json

      - name: Install and test
        working-directory: tahp-console
        run: |
          npm ci
          npm test

      - name: Skills structure check
        shell: bash
        run: |
          missing=0
          for skill in skills/.claude/skills/*/; do
            [ -f "${skill}SKILL.md" ] || { echo "Missing SKILL.md in ${skill}"; missing=1; }
          done
          exit $missing
