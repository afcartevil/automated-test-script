[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [-53069275, -61256984, 12016538, 197622056]

[vtskin-param]
sensor= vtskin2
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [-68602966, -65311618, 11155541, 218868730]

[vtskin-param]
sensor= vtskin3
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [-59979338, -52627643, 13478875, 194680042]

[vtskin-param]
sensor= vtskin4
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [14742398, -112621032, 1177365, 191410489]

[vtskin-param]
sensor= vtskin5
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [16219104, -110722601, 3540964, 186474078]

[vtskin-param]
sensor= vtskin6
operation= coefficient
ref_sensor= [ap_ntc, nrpa_ntc, battery, ltepa_ntc]
ref_coef=   [16746379, -157056676, 4533995, 231328570]

[vtskin-param]
sensor= vtskin-max
operation= maximum
ref_sensor= [vtskin1, vtskin2, vtskin3, vtskin4, vtskin5, vtskin6]

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 58000
trip_tpcb= 47000
target_tpcb= 49000
atc_mode= enable
polling_time= 10
steady_target_tj= 65000

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [53000]
hysteresis= [2000]
current= [0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [52000, 53000, 54000, 56000, 60000, 80000]
