[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[LTF]
thermal_zone= soc_max
mode= enabled

[vtskin-param]
sensor= vtskin1
mode= disabled

[vtskin-param]
sensor= vtskin2
mode= disabled

[vtskin-param]
sensor= vtskin3
mode= disabled

[vtskin-param]
sensor= vtskin4
mode= disabled

[vtskin-param]
sensor= vtskin5
mode= disabled

[vtskin-param]
sensor= vtskin6
mode= disabled

[vtskin-param]
sensor= vtskin-max
mode= disabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 95000
trip_tpcb= 77000
target_tpcb= 80000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[charger-cooler]
mode= disabled

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [80000, 80000, 80000, 80000]
