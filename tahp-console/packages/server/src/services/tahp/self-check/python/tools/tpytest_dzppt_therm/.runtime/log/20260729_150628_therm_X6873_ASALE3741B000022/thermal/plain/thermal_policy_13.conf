[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 64000
trip_tpcb= 48000
target_tpcb= 51000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 0
threshold= [44000, 47000, 50000, 53000]
hysteresis= [2000, 2000, 2000, 2000]
freq= [1900000, 1800000, 1700000, 1000000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 1
threshold= [44000, 47000, 50000, 53000]
hysteresis= [2000, 2000, 2000, 2000]
freq= [2400000, 2200000, 1700000, 1600000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 2
threshold= [44000, 47000, 50000, 53000]
hysteresis= [2000, 2000, 2000, 2000]
freq= [2400000, 2200000, 1700000, 1300000]

[mtk-cpu-isolate]
mode= enabled
sensor= ap_ntc
cpu= [cpu3, cpu5, cpu6, cpu7]
threshold= [68500, 65500, 63500, 59500]
hysteresis= [2000, 2000, 2000, 2000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [46500, 48500, 50000, 59500]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [46000, 50000, 52000, 59500, 61500, 83500]

