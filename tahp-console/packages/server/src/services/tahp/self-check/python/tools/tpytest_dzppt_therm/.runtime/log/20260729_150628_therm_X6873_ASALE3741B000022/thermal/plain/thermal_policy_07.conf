[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[vtskin-param]
sensor= vtskin1
mode= disabled

[vtskin-param]
sensor= vtskin2
mode= disabled

[vtskin-param]
sensor= vtskin3
mode= disabled

[vtskin-param]
sensor= vtskin4
mode= disabled

[vtskin-param]
sensor= vtskin5
mode= disabled

[vtskin-param]
sensor= vtskin6
mode= disabled

[vtskin-param]
sensor= vtskin-max
mode= disabled

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 63000
trip_tpcb= 51000
target_tpcb= 53000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 0
threshold= [42000, 44000, 46000, 48000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [2100000, 2000000, 1900000, 1800000, 1700000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 1
threshold= [42000, 44000, 46000, 48000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [2800000, 2660000, 2500000, 2400000, 2000000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 2
threshold= [42000, 44000, 46000, 48000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [2800000, 2700000, 2400000, 2100000, 2000000]

[mtk-cpu-isolate]
mode= enabled
sensor= ap_ntc
cpu= [cpu3, cpu5, cpu6, cpu7]
threshold= [68500, 65500, 63500, 59500]
hysteresis= [2000, 2000, 2000, 2000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [48000, 49000, 50000, 53000]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [44000, 52000, 54000, 56000, 58000, 80000]
