[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[vtskin-param]
sensor= vtskin1
mode= disabled

[vtskin-param]
sensor= vtskin2
mode= disabled

[vtskin-param]
sensor= vtskin3
mode= disabled

[vtskin-param]
sensor= vtskin4
mode= disabled

[vtskin-param]
sensor= vtskin5
mode= disabled

[vtskin-param]
sensor= vtskin6
mode= disabled

[vtskin-param]
sensor= vtskin-max
mode= disabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 55000
trip_tpcb= 50000
target_tpcb= 53000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[mtk-cpu-isolate]
mode= enabled
sensor= ap_ntc
cpu= [cpu3, cpu5, cpu6, cpu7]
threshold= [68000, 64000, 64000, 60000]
hysteresis= [2000, 2000, 2000, 2000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [48000, 50000, 55000, 58000]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [53000, 58000, 60000, 80000]
