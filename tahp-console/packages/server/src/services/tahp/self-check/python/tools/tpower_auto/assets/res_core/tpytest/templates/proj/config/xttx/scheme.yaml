# ------ 测试方案元配置 ------

# 测试方案的名称
name: 'xttx'

# 测试方案所属团队名
team: 'xttx'

# 测试方案保存用户配置的缓存文件夹（一般在团队元配置中写入，测试方案通过继承的方式使用该值，当然也可不配置，会自动在用户目录生成）
override_cache_dir: 'D:\tpytest_xttx_configs'

# 指定需要的拓展插件（用于剪枝发布）
plugins:
  - tpy_aw
  - tpytest_extends
  - cv_utils

# 指定需要的资源文件（用于剪枝发布）
#assets:
#  - assets/res_plugins/qss
