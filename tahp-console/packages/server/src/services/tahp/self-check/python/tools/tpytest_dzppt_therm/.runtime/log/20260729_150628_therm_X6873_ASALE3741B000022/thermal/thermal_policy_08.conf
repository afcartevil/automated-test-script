[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 80000
trip_tpcb= 57000
target_tpcb= 59000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[charger-cooler]
mode= disabled

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [80000, 80000 ,80000, 80000, 80000, 80000]
