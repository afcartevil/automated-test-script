[pytest]

addopts = -v -s
; 设置为1，日志更详细
log_cli = 0
log_cli_level = DEBUG
testpaths = .
markers =
    test_app(arg): 标记一个主测机所需的App名称
    test_app_from_config(arg): 标记一个主测机所需的App列表（从user_config中的arg字段获取）
    copilot_app(arg): 标记一个辅助机所需的App名称
    copilot_app_from_config(arg): 标记一个辅助机所需的App列表（从user_config中的arg字段获取）
    order_suggest(arg): 建议测试顺序
    pretest_level(arg): 预测试等级，等级越高，测试越复杂
    only_overseas_or_not(arg): 该用例是否仅在海外测试或者仅国内测试
    only_whole_phone_test_or_not(arg): 该用例是否仅在整机测试或拆机测试
    case_config(**kwargs): 对test方法添加自定义配置参数
    pretest_config(**kwargs): 对pretest方法添加自定义配置参数
    link_pretest(**kwargs): 关联pretest用例，可使用name或者flag的方式来关联
    exclude_collect: 按正则、类、通配符收集用例时，将该用例排除在外
    retry(arg): 失败重测次数
    need_copilot: 该用例需要辅助机
    need_observe: 该用例需要观测机
    taep_case(arg): 标记该用例是TAEP用例，并指定该TAEP用例的位置
