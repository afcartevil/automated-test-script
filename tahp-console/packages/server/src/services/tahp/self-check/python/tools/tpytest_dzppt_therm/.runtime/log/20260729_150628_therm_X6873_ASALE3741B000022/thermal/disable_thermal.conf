[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= disabled

[vtskin-param]
sensor= vtskin1
mode= disabled

[vtskin-param]
sensor= vtskin2
mode= disabled

[vtskin-param]
sensor= vtskin3
mode= disabled

[vtskin-param]
sensor= vtskin4
mode= disabled

[vtskin-param]
sensor= vtskin5
mode= disabled

[vtskin-param]
sensor= vtskin6
mode= disabled

[vtskin-param]
sensor= vtskin-max
mode= disabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 300000
min_target_tj= 300000
trip_tpcb= 53000
target_tpcb= 56000
atc_mode= disable
debug_mode= enable
polling_time= 1
steady_target_tj= 91500

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [300000, 300000, 300000, 300000]
