[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 70000
trip_tpcb= 52000
target_tpcb= 56000
atc_mode= enable
polling_time= 1
steady_target_tj= 91500

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 0
threshold= [36000, 50000, 56000]
hysteresis= [2000, 2000, 2000]
freq= [2000000, 1900000, 1800000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 1
threshold= [36000, 50000, 56000]
hysteresis= [2000, 2000, 2000]
freq= [2800000, 2800000, 2600000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 2
threshold= [36000, 50000, 56000]
hysteresis= [2000, 2000, 2000]
freq= [2800000, 2500000, 2400000]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [46000, 54000, 57000, 60000, 70000, 80000]
