[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 95000
min_target_tj= 60000
trip_tpcb= 47500
target_tpcb= 50500

cluster0_min_throttle_freq= 600000
cluster1_min_throttle_freq= 1000000
cluster2_min_throttle_freq= 800000
gpu_min_throttle_freq= -1

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 0
threshold= [40000, 42000, 44000, 46000, 47000, 48000, 49000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000]
freq= [2000000, 1900000, 1800000, 1700000, 1600000, 1500000, 1400000, 1300000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 1
threshold= [40000, 42000, 44000, 46000, 47000, 48000, 49000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000]
freq= [2600000, 2600000, 2400000, 2200000, 2000000, 1800000, 1700000, 1600000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 2
threshold= [40000, 42000, 44000, 46000, 47000, 48000, 49000, 50000]
hysteresis= [2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000]
freq= [2600000, 2400000, 2000000, 1700000, 1600000, 1500000, 1400000, 1300000]

[mtk-cpu-isolate]
mode= enabled
sensor= ap_ntc
cpu= [cpu3, cpu5, cpu6, cpu7]
threshold= [68500, 65500, 63500, 59500]
hysteresis= [2000, 2000, 2000, 2000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [46000, 48000, 50000, 56000]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [light, moderate, severe, critical, emergency, shutdown]
threshold= [44000, 48000, 51500, 59500, 61500, 83500]
